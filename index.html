<template id="lesson-operator-variants">
      <p class="eyebrow">15 · Method comparison</p>
      <h1>Finding a direction does not determine what to do with it.</h1>
      <p class="lede">The same measured basis can be deleted, attenuated, reflected, rotated, regularized, sparsified, or applied with a depth schedule. These operators have different semantics even when their refusal score looks similar.</p>
      <div class="lesson-meta"><span>◷ 30 MIN</span><span>◇ ADVANCED</span><span>⌁ OPERATOR GEOMETRY</span></div>

      <div class="scope-banner"><strong>Keep axes separate</strong><p>Direction discovery, layer localization, and intervention operator are independent choices. A top-k whitened basis can still use partial projection; a single mean direction can still use reflection or conditional angular steering.</p></div>

      <h2>The operator atlas</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Operator</th><th>Mathematical action</th><th>Practical advantage</th><th>Practical disadvantage</th></tr></thead>
        <tbody>
          <tr><td>Exact projection</td><td><code>h′=(I−BᵀB)h</code> for orthonormal rows</td><td>Closed form, interpretable, and completely removes the measured coordinate.</td><td>Abrupt global deletion; collateral loss grows with overlap and rank.</td></tr>
          <tr><td>Partial attenuation</td><td><code>h′=(I−αBᵀB)h</code>, <code>0&lt;α&lt;1</code></td><td>Simple continuous tradeoff and easy dose-response testing.</td><td>Residual refusal may remain; one scalar may fit layers poorly.</td></tr>
          <tr><td>Ridge attenuation</td><td><code>Pλ=Gᵀ(GGᵀ+λI)⁻¹G</code>; <code>h′=(I−Pλ)h</code></td><td>Stable with correlated or noisy directions; <code>λ→0</code> approaches span removal.</td><td><code>Pλ</code> is not a projector; <code>λ→∞</code> approaches identity and mixes stability with strength.</td></tr>
          <tr><td>Householder reflection</td><td><code>h′=(I−2bbᵀ)h</code>, <code>‖b‖=1</code></td><td>Norm-preserving and powerful as a bidirectional causal test.</td><td>Flips the coordinate instead of erasing it; usually more disruptive.</td></tr>
          <tr><td>Translation / steering</td><td><code>h′=h+βr̂</code></td><td>Simple signed induction or suppression without flattening variation.</td><td>Moves every selected state equally and is adjacent to—not the same as—ablation.</td></tr>
          <tr><td>Angular rotation</td><td>Rotate in a chosen 2D plane by angle <code>θ</code>.</td><td>Preserves norm and exposes smooth, signed control.</td><td>Requires a defensible plane and can move states off their natural manifold.</td></tr>
          <tr><td>Norm-restored projection</td><td>Project, then rescale each chosen residual-output vector.</td><td>Preserves one scale statistic and can reduce scale drift.</td><td>Scalar per-vector restoration preserves orthogonality; anisotropic coordinate or stored-row restoration can reintroduce basis energy.</td></tr>
          <tr><td>Sparse projection</td><td>Edit only high-support coordinates, rows, heads, or features.</td><td>Smaller footprint and better mechanistic localization.</td><td>Basis-dependent, threshold-sensitive, and vulnerable to alternate paths.</td></tr>
          <tr><td>Depth-scheduled projection</td><td>Use <code>αₗ</code> or a smooth basis <code>Bₗ</code> across layers.</td><td>Tracks layer rotation and concentrates change in a causal window.</td><td>Adds many selection degrees of freedom and overfitting risk.</td></tr>
        </tbody>
      </table></div>

      <h2>The full strength spectrum</h2>
      <div class="formula">h′ = (I − αP)h, where P = BᵀB
coordinate inside the subspace is multiplied by (1 − α)

α = 0      identity
0 &lt; α &lt; 1  same-side attenuation
α = 1      deletion / projection
1 &lt; α &lt; 2  inverted attenuation
α = 2      Householder-style reflection across the complement
α &gt; 2      inverted amplification
α &lt; 0      same-side amplification
<small>For an orthogonal projector P, I−2P is norm-preserving. Only α=1 is exact deletion.</small></div>

      <div class="formula">layer/time schedule:
W′ₗ = [I − αₗ Bₛ₍ₗ₎ᵀBₛ₍ₗ₎]Wₗ
<small><code>s(l)</code> chooses the source basis used at destination layer l. Smooth schedules reduce abrupt depth changes; every free <code>αₗ</code> or source switch increases selection risk.</small></div>

      <h2>Decompose every operator into five questions</h2>
      <div class="pipeline">
        <div class="pipeline-step"><b>FIX THE BASIS</b><span>Compare operators on exactly the same direction or subspace.</span></div>
        <div class="pipeline-step"><b>MATCH STRENGTH</b><span>Use target effect or update norm, not incomparable default scales.</span></div>
        <div class="pipeline-step"><b>SWEEP DOSE</b><span>Plot the full response curve for <code>α</code>, <code>λ</code>, angle, or sparsity.</span></div>
        <div class="pipeline-step"><b>MEASURE DRIFT</b><span>Track behavior, KL/NLL, geometry, calibration, and long outputs.</span></div>
        <div class="pipeline-step"><b>REPEAT AFTER SAVE</b><span>Verify the exact folded and deployed artifact.</span></div>
      </div>

      <h2>What the modifiers really preserve</h2>
      <div class="concept-grid">
        <div class="concept-card"><code>Regularization</code><p>Preserves some fitted component or stabilizes an inverse; it does not identify which semantics are protected.</p></div>
        <div class="concept-card"><code>Norm restoration</code><p>Preserves length at the chosen granularity; it does not preserve direction, logits, calibration, or capability.</p></div>
        <div class="concept-card"><code>Sparsity</code><p>Preserves untouched coordinates or components; it does not prove the chosen basis is causally privileged.</p></div>
        <div class="concept-card"><code>Optimization</code><p>Preserves what appears in its loss and data; omitted behavior can still drift or be exploited by the search.</p></div>
      </div>
      <div class="callout warning"><strong>Reflection is not “stronger ablation”</strong><p>Projection sends the measured coordinate to zero. Reflection preserves its magnitude and reverses its sign. Both can lower a refusal score, but they make different causal claims and should never share a label.</p></div>
      <div class="quiz"><strong>Checkpoint</strong><p>Compare operators at matched target effect and matched basis. Otherwise the apparent winner may simply be the one that applied a larger perturbation.</p></div></template>
<template id="lesson-method-comparison">
      <p class="eyebrow">16 · Method comparison</p>
      <h1>There is no best method without a stated failure budget.</h1>
      <p class="lede">Simple methods have low variance and clear math; richer methods can be more selective but require more data, tuning, and validation. Choose by the geometry you can justify and the side effects you can measure.</p>
      <div class="lesson-meta"><span>◷ 36 MIN</span><span>◇ REFERENCE</span><span>▦ SIDE-BY-SIDE</span></div>

      <h2>A method is a tuple of choices</h2>
      <div class="formula">M = (contrast C, estimator E, localization L, operator A, persistence P)

C: what differs?       E: what geometry is fitted?
L: where is it causal? A: how are states changed?
P: runtime or weights?
<small>Two studies that both say “SVD abliteration” can still implement different methods on every other axis.</small></div>
      <p>Keep these axes independent in both experiments and explanations. Paired data does not require SVD; a whitened basis does not require permanent editing; a sparse target does not require a sparse estimator.</p>

      <h2>The bias–variance ladder</h2>
      <div class="pipeline">
        <div class="pipeline-step"><b>ONE MEAN AXIS</b><span>Least data and lowest estimator variance; strongest linearity assumption.</span></div>
        <div class="pipeline-step"><b>RANK-k SUBSPACE</b><span>Captures several modes; rank selection adds variance.</span></div>
        <div class="pipeline-step"><b>COVARIANCE-AWARE</b><span>Models protected geometry; needs many stable controls.</span></div>
        <div class="pipeline-step"><b>SPARSE / CIRCUIT</b><span>Targets finer causal sites; localization can be fragile.</span></div>
        <div class="pipeline-step"><b>LEARNED / GATED</b><span>Most flexible and potentially selective; largest overfit and audit surface.</span></div>
      </div>

      <h2>Comparison axes that matter in practice</h2>
      <div class="metric-grid">
        <div class="metric"><code>Data burden</code><p>Means need dozens to hundreds; stable covariance, sparse, and learned methods can need far more.</p></div>
        <div class="metric"><code>Interpretability</code><p>Closed-form rank-one projection is easiest to inspect; optimized maps are harder to attribute.</p></div>
        <div class="metric"><code>Selectivity</code><p>Conditional and localized edits may reduce global drift, but rely on additional learned boundaries.</p></div>
        <div class="metric"><code>Reversibility</code><p>Runtime maps are easy to disable; folded weights need a pristine checkpoint and rollback artifact.</p></div>
        <div class="metric"><code>Serving cost</code><p>Weight edits add little inference overhead; dynamic gates and hooks add computation and state.</p></div>
        <div class="metric"><code>Evidence burden</code><p>Every extra rank, gate, feature, or optimizer adds a degree of freedom that needs untouched evaluation.</p></div>
      </div>

      <h2>Major method families</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Family</th><th>Core math</th><th>Advantages</th><th>Disadvantages / best use</th></tr></thead>
        <tbody>
          <tr><td>Mean-direction projection</td><td><code>r=μR−μA</code>; project out <code>r̂</code>.</td><td>Cheap, stable, closed form, strong baseline.</td><td>Mixes confounds and modes. Best first experiment.</td></tr>
          <tr><td>Fisher / LDA direction</td><td><code>w=(ΣR+ΣA+λI)⁻¹(μR−μA)</code>.</td><td>Downweights high-noise axes while retaining a single interpretable direction.</td><td>Covariance- and ridge-sensitive. Best when means separate poorly relative to within-class noise.</td></tr>
          <tr><td>Paired rank-k SVD</td><td>Top right singular vectors of paired deltas.</td><td>Retains multiple recurring modes and pair structure.</td><td>Needs good pairing and rank selection. Best when one axis underfits.</td></tr>
          <tr><td>Whitened / generalized eigen</td><td>Contrast energy relative to protected covariance.</td><td>Prioritizes change in otherwise stable directions.</td><td>Sample-hungry and inversion-sensitive. Best with large representative controls.</td></tr>
          <tr><td>ACE</td><td>Project, then re-center at an answer-side affine coordinate.</td><td>Avoids forcing all states to an arbitrary zero.</td><td>One center may flatten multimodal answers. Best for clear affine separation.</td></tr>
          <tr><td>LEACE</td><td>Closed-form covariance-aware linear erasure.</td><td>Minimum distortion under its covariance-weighted linear objective.</td><td>Only removes linear cross-covariance. Best when protected covariance is trustworthy.</td></tr>
          <tr><td>INLP / R-LACE</td><td>Iterated or adversarial fixed-rank nullspace learning.</td><td>Targets residual linear decodability more thoroughly.</td><td>Can chase probes without changing behavior. Best as a representation-erasure control.</td></tr>
          <tr><td>Margin / controlled evasion</td><td>Minimum move across a calibrated linear boundary.</td><td>Changes only states that need to cross and supports explicit margin.</td><td>Probe boundary may not be causal. Best for reversible runtime testing.</td></tr>
          <tr><td>Gaussian transport</td><td>Affine map matching refusal and answer means/covariances.</td><td>Matches the answer-side first two moments instead of collapsing a coordinate.</td><td>Gaussian, low-rank, and matching assumptions. Best with dense matched data.</td></tr>
          <tr><td>SAE / sparse feature edit</td><td>Clamp or transform selected sparse latents.</td><td>Human-interpretable candidates and small activation footprint.</td><td>Reconstruction and feature-splitting errors. Best after causal feature validation.</td></tr>
          <tr><td>Circuit-localized edit</td><td>Patch or modify verified heads, neurons, experts, or paths.</td><td>Potentially highest mechanistic selectivity.</td><td>Expensive combinatorial search and self-repair. Best for research-grade localization.</td></tr>
          <tr><td>Learned low-rank / ReFT</td><td>Optimize a small linear or affine hidden-state map through end-to-end losses.</td><td>Flexible learned objective and explicit protection terms.</td><td>Training and scorer overfit. Best when closed forms visibly underfit.</td></tr>
          <tr><td>Conditional gate</td><td>Apply another operator only when a classifier or latch fires.</td><td>Can preserve unrelated prompts by avoiding a global edit.</td><td>Moves the problem into gate calibration. Best when context-specific control is required.</td></tr>
        </tbody>
      </table></div>

      <h2>No universal winner</h2>
      <p>The expected progression is evidence-driven: mean direction → rank-k → covariance-aware → localized or conditional → learned map. Stop as soon as a simpler method reaches the desired target effect inside the declared protected-drift budget. Complexity is justified by a measured failure of the previous rung, not by novelty.</p>
      <div class="callout warning"><strong>Do not compare names</strong><p>Compare resolved mathematics, data, layer/token sites, rank, strength, update norm, persistence, and evaluation. A sophisticated family with weak controls is less informative than a rank-one baseline with strong causal and held-out evidence.</p></div></template>
<template id="lesson-method-selection">
      <p class="eyebrow">17 · Method comparison</p>
      <h1>Escalate the method only when a simpler assumption fails.</h1>
      <p class="lede">Method choice should follow the geometry and failure mode you observe. Once chosen, test the operator's invariants separately from whether it changes model behavior.</p>
      <div class="lesson-meta"><span>◷ 28 MIN</span><span>◇ PRACTICAL</span><span>⌕ DECISION GUIDE</span></div>

      <h2>Five decisions, in order</h2>
      <div class="pipeline">
        <div class="pipeline-step"><b>DEFINE OUTCOME</b><span>Separate refusal, answer quality, evasion, harm recognition, and capability.</span></div>
        <div class="pipeline-step"><b>FIT SIMPLE</b><span>Start with an outcome-screened mean direction and runtime projection.</span></div>
        <div class="pipeline-step"><b>DIAGNOSE FAILURE</b><span>Underfit, confounding, collateral drift, self-repair, or deployment mismatch?</span></div>
        <div class="pipeline-step"><b>ADD ONE IDEA</b><span>Rank, covariance, locality, conditionality, or learned flexibility—one at a time.</span></div>
        <div class="pipeline-step"><b>RETEST CLAIM</b><span>Use untouched data, causal controls, and exact deployed bytes.</span></div>
      </div>

      <h2>Failure → method escalation</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Observed failure</th><th>Next method to try</th><th>Why—and what could still go wrong</th></tr></thead>
        <tbody>
          <tr><td>One direction misses categories or styles</td><td>Paired rank-k SVD or category prototypes</td><td>Captures multiple modes; extra rank can erase unrelated behavior.</td></tr>
          <tr><td>Direction overlaps ordinary benign variation</td><td>Whitening, LDA, LEACE, or protected spectral cleaning</td><td>Uses protected covariance; unstable inversion can amplify noise.</td></tr>
          <tr><td>Zero projection produces unnatural states</td><td>ACE recentering, margin crossing, angular rotation, or transport</td><td>Targets an answer-side region; distributional assumptions can be wrong.</td></tr>
          <tr><td>Global edit damages unrelated prompts</td><td>Conditional gate or causal component localization</td><td>Reduces exposure; the gate or localization can introduce new errors.</td></tr>
          <tr><td>Single-layer effect is repaired downstream</td><td>Trajectory measurement and small depth schedule</td><td>Suppresses reconstruction; extra layer choices increase overfit.</td></tr>
          <tr><td>Dense edit is too broad</td><td>SAE feature, head, neuron, row, or expert intervention</td><td>Shrinks footprint; sparse coordinates are basis- and threshold-dependent.</td></tr>
          <tr><td>Closed-form maps visibly underfit</td><td>Learned low-rank or ReFT-style map with protected loss</td><td>Adds flexibility; training and evaluator overfit become central risks.</td></tr>
          <tr><td>Full-precision result fails after export</td><td>Remeasure or retune in the deployment numerical condition</td><td>Matches actual geometry; conclusions become artifact-specific.</td></tr>
        </tbody>
      </table></div>

      <h2>Mathematical invariant tests</h2>
      <div class="concept-grid">
        <div class="concept-card"><code>Shape test</code><p>For every target, assert which axis lives in residual space and verify projection on a tiny synthetic matrix.</p></div>
        <div class="concept-card"><code>Projector test</code><p>For an orthogonal projector, assert symmetry <code>Pᵀ=P</code> and idempotence <code>P²=P</code>; ridge shrinkage should not pass the latter.</p></div>
        <div class="concept-card"><code>Energy test</code><p>Measure basis energy before and after; test <code>α=0</code>, <code>1</code>, <code>2</code>, fractional, and negative boundaries.</p></div>
        <div class="concept-card"><code>Equivalence test</code><p>On a toy block, compare runtime projection with the intended folded weights, biases, and initial residual.</p></div>
        <div class="concept-card"><code>Round-trip test</code><p>Save, reload in a fresh process, and compare tensor hashes, logits, and generations under fixed seeds.</p></div>
        <div class="concept-card"><code>Negative control</code><p>Apply a random basis of the same rank and norm to separate targeted effect from generic damage.</p></div>
      </div>
      <div class="callout"><strong>Selection rule</strong><p>Prefer the method with the fewest fitted degrees of freedom that reaches the target-effect threshold inside the protected-drift budget and survives the decisive counter-test for its core assumption.</p></div></template>
<template id="lesson-experiment-ladder">
      <p class="eyebrow">18 · Evidence & practice</p>
      <h1>Earn complexity one test at a time.</h1>
      <p class="lede">A defensible study does not begin with the most elaborate edit. It begins with a frozen system, a minimal baseline, and tests designed to falsify the explanation you hope is true.</p>
      <div class="lesson-meta"><span>◷ 30 MIN</span><span>◇ ADVANCED</span><span>↗ EVIDENCE LADDER</span></div>

      <h2>Stage 0 · Freeze the object of study</h2>
      <div class="checklist">
        <label><input type="checkbox" disabled> Exact base checkpoint revision and tensor hashes</label>
        <label><input type="checkbox" disabled> Tokenizer files, special token IDs, and rendered chat template</label>
        <label><input type="checkbox" disabled> Inference engine, precision, quantization, kernels, and versions</label>
        <label><input type="checkbox" disabled> Prompt splits, actual baseline outcomes, languages, and categories</label>
        <label><input type="checkbox" disabled> Sampling parameters, seeds, stop strings, and maximum generation length</label>
        <label><input type="checkbox" disabled> Direction estimator, token tap, layer map, targets, rank, and strength</label>
      </div>

      <h2>Stages 1–6</h2>
      <div class="pipeline">
        <div class="pipeline-step"><b>1 · ESTABLISH BASELINES</b><span>Unedited, random same-rank edit, one mean direction, and runtime projection before permanent surgery.</span></div>
        <div class="pipeline-step"><b>2 · ISOLATE THE SIGNAL</b><span>Use actual outcomes, four-cell contrasts, matched pairs, nuisance residualization, and train/validation/test separation.</span></div>
        <div class="pipeline-step"><b>3 · MAP GEOMETRY</b><span>Compare mean, paired SVD, whitened, and rank-k candidates across layers and token positions.</span></div>
        <div class="pipeline-step"><b>4 · ESTABLISH CAUSALITY</b><span>Remove and add the candidate, sweep dose, patch matched activations, and test downstream reconstruction.</span></div>
        <div class="pipeline-step"><b>5 · CHOOSE THE EDIT</b><span>Compare target effect at matched protected drift; select the smallest Pareto-efficient intervention.</span></div>
        <div class="pipeline-step"><b>6 · ATTACK THE CLAIM</b><span>Use unseen sources, paraphrases, languages, multi-turn contexts, long decoding, and probes trained after editing.</span></div>
      </div>

      <h2>Evidence matrix</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Claim</th><th>Minimum supporting test</th><th>Common false positive</th></tr></thead>
        <tbody>
          <tr><td>The direction predicts refusal</td><td>Held-out outcome classification across topics and prompt sources</td><td>It predicts harmful topic or template format.</td></tr>
          <tr><td>The direction causes refusal</td><td>Removal lowers and addition raises refusal with a dose response</td><td>A generic same-rank perturbation also changes generation.</td></tr>
          <tr><td>The layer is a causal writer</td><td>Matched patching or localized edit at that site</td><td>A probe merely decodes a feature copied from elsewhere.</td></tr>
          <tr><td>The edit is selective</td><td>Target gain at matched benign, knowledge, reasoning, and calibration drift</td><td>Short outputs or degraded language look like fewer refusals.</td></tr>
          <tr><td>The result generalizes</td><td>Unseen domains, formulations, languages, and conversations</td><td>Near-duplicates leak across the split.</td></tr>
          <tr><td>The artifact works</td><td>Fresh-process evaluation of exact saved or quantized bytes</td><td>Only the in-memory reference-precision model was tested.</td></tr>
        </tbody>
      </table></div>

      <h2>Choose on a frontier, not one leaderboard column</h2>
      <div class="formula">target_effect = baseline refusal − edited refusal
protected_drift = f(ΔNLL, ΔKL, task loss, calibration, safety, stability)
<small>An edit dominates another only if it improves target effect without worsening protected drift, or lowers drift at equal effect.</small></div>
      <p>Rank, layer coverage, and strength all change the frontier. Report the full sweep—including failed and unstable points—rather than selecting a single favorable run after looking at the test set.</p>
      <div class="quiz"><strong>Checkpoint</strong><p>A 40-point refusal reduction with a large NLL regression is not automatically better than a 25-point reduction with negligible drift. The decision depends on a declared use case and guardrails, not the drama of the headline.</p></div></template>
<template id="lesson-metrics-acronyms">
    <p class="eyebrow">19 · Evidence & practice</p>
    <h1>A metric is a question with a number attached.</h1>
    <p class="lede">Abliteration changes several things at once: refusal behavior, answer quality, safety, probability distributions, internal geometry, and sometimes deployment stability. No single score summarizes all of them honestly.</p>
    <div class="lesson-meta"><span>◷ 36 MIN</span><span>◇ INTERMEDIATE REFERENCE</span><span>∑ FORMULAS + PLAIN ENGLISH</span></div>
    <div class="metrics-lesson">

    <div class="scope-banner"><strong>The reading rule</strong><p>Every reported number needs five labels: <em>split</em>, <em>numerator and denominator</em>, <em>units</em>, <em>direction</em>, and <em>model condition</em>. “Lower is better” is incomplete: lower refusal can mean a stronger behavior edit on one test and worse safety on another.</p></div>

    <h2>First ask which question the number answers</h2>
    <div class="metric-grid">
      <div class="metric"><code>Behavior</code><p>Did the model explicitly refuse, answer substantively, evade, fail, or produce unsafe content?</p></div>
      <div class="metric"><code>Utility</code><p>Did knowledge, reasoning, language modeling, calibration, and ordinary task performance survive?</p></div>
      <div class="metric"><code>Distribution drift</code><p>How much did the edited model's token probabilities move away from the baseline?</p></div>
      <div class="metric"><code>Mechanism</code><p>Was the measured direction stable, removed at the intended site, and causally connected to the outcome?</p></div>
    </div>

    <h2>Notation used on this page</h2>
    <div class="formula">𝓗 = harmful or target prompt split       𝓝 = benign or protected prompt split
p₀(v | cₜ) = baseline probability of token v in context cₜ
p₁(v | cₜ) = edited-model probability of token v in the same context
yₜ = reference token at position t          T = number of scored tokens
U = row-orthonormal edit basis, UUᵀ = I
<small>Unless stated otherwise, probability metrics compare the same prompts, templates, reference continuations, token positions, and vocabulary. Changing those conditions changes the measurement.</small></div>

    <h2>Language-model and distribution-drift metrics</h2>
    <div class="method-table-wrap"><table class="method-table">
      <thead><tr><th>Name</th><th>Definition</th><th>Plain-English meaning</th><th>How to read it</th></tr></thead>
      <tbody>
        <tr><td><strong>NLL</strong><br>Negative Log-Likelihood</td><td><code>−(1/T) Σₜ log p(yₜ | cₜ)</code></td><td>Average surprise assigned to the actual reference tokens.</td><td>Lower is better on a fixed corpus. With natural logs the unit is <em>nats per token</em>. Report <code>ΔNLL = NLL₁ − NLL₀</code>; positive means regression.</td></tr>
        <tr><td><strong>CE</strong><br>Cross-Entropy</td><td><code>H(q,p)=−Σᵥ q(v) log p(v)</code></td><td>How well predicted probabilities match a target distribution <code>q</code>.</td><td>Lower is better. One context is measured in nats or bits; an average over token contexts is nats or bits per token. For one-hot targets, average CE equals NLL.</td></tr>
        <tr><td><strong>PPL</strong><br>Perplexity</td><td><code>PPL = exp(NLL)</code> when NLL uses natural logs</td><td>An effective branching factor: how many similarly plausible token choices the model acts as if it faces.</td><td>Lower is better on the same tokens and tokenizer. Average NLL first, then exponentiate; never average per-token perplexities.</td></tr>
        <tr><td><strong>KL</strong><br>Kullback–Leibler divergence</td><td><code>D<sub>KL</sub>(p₀‖p₁)=Σᵥ p₀(v) log[p₀(v)/p₁(v)]</code></td><td>How costly it is to use the edited distribution where the baseline distribution is the reference.</td><td>Zero means identical distributions at the measured contexts; lower means less drift. It is asymmetric. Report argument order and nats or bits per token.</td></tr>
        <tr><td><strong>JSD</strong><br>Jensen–Shannon divergence</td><td><code>½KL(p₀‖m)+½KL(p₁‖m)</code>, <code>m=(p₀+p₁)/2</code></td><td>A symmetric, smoothed comparison of two distributions.</td><td>Lower means less drift. With natural logs it ranges from 0 to <code>ln 2</code>; its square root is a metric.</td></tr>
        <tr><td><strong>TV</strong><br>Total Variation distance</td><td><code>½Σᵥ |p₀(v)−p₁(v)|</code></td><td>The largest probability difference the two distributions can assign to an event.</td><td>Ranges from 0 to 1; lower means less drift. It is often easier to interpret than raw logit distance.</td></tr>
        <tr><td><strong>Entropy H</strong></td><td><code>H(p)=−Σᵥ p(v) log p(v)</code></td><td>How spread out one model's next-token distribution is.</td><td>One context is measured in nats or bits; average entropy is nats or bits per token. No universal direction: lower can mean confidence or collapse.</td></tr>
        <tr><td><strong>Logit drift</strong></td><td><code>dₜ=√[(1/|𝒱|)Σᵥ((z₁ᵥ−z̄₁)−(z₀ᵥ−z̄₀))²]</code></td><td>RMS movement in centered scores over vocabulary <code>𝒱</code>; <code>z̄</code> is that context's vocabulary-mean logit.</td><td>Average <code>dₜ</code> over declared contexts. Lower is closer, in centered-logit units. A constant logit shift correctly contributes zero.</td></tr>
      </tbody>
    </table></div>

    <h2>KL, carefully</h2>
    <div class="formula">D_KLᵗ(p ‖ q) = Σᵥ p(v | cₜ) ln[p(v | cₜ) / q(v | cₜ)]
mean KL = (1/T) Σₜ D_KLᵗ

baseline-preservation view: D_KL(p₀ ‖ p₁)
edited-support view:       D_KL(p₁ ‖ p₀)
<small>The first weights mistakes by what the baseline considered likely. The reverse weights where the edit places its own probability mass. They answer different questions and can have very different values.</small></div>
    <div class="concept-grid">
      <div class="concept-card"><code>Unit</code><p>Natural logarithms produce <strong>nats</strong>; base-2 logarithms produce bits. When averaged, report nats or bits <em>per token</em>.</p></div>
      <div class="concept-card"><code>Aggregation</code><p>Compute full-vocabulary KL at each matched context—usually teacher-forced—then state how tokens and prompts were averaged. Long prompts otherwise receive more weight.</p></div>
      <div class="concept-card"><code>Direction</code><p><code>KL(p₀‖p₁)</code> is not <code>KL(p₁‖p₀)</code>. A label such as “KL to baseline” is ambiguous unless the formula or argument order is shown.</p></div>
      <div class="concept-card"><code>Blind spot</code><p>A small mean KL can hide a large shift on a rare category, late decoding step, or safety-critical token. Stratify and inspect tails.</p></div>
    </div>
    <div class="callout warning"><strong>What KL does not mean</strong><p>KL is not accuracy, factuality, semantic similarity, safety, or proof that generations are unchanged. It compares probability distributions only under the contexts you actually measured.</p></div>

    <h2>Behavior and safety metrics</h2>
    <div class="method-table-wrap"><table class="method-table">
      <thead><tr><th>Acronym / metric</th><th>Definition</th><th>Desired direction</th><th>Main trap</th></tr></thead>
      <tbody>
        <tr><td><strong>RR</strong><br>Refusal Rate</td><td><code>RR(S)=(100/n<sub>S</sub>) Σ<sub>i∈S</sub> 1[refusalᵢ]</code> on named split <code>S</code>.</td><td>On a refusal-removal target, lower means a stronger edit. On harmful requests, lower may mean worse safety.</td><td>Phrase matching misses semantic refusals and can count empty or evasive text as compliance.</td></tr>
        <tr><td><strong>ASR</strong><br>Attack Success Rate</td><td><code>(100/n<sub>𝓗</sub>) Σ<sub>i∈𝓗</sub> 1[substantive successᵢ]</code> under a declared rubric.</td><td>Higher means a more successful bypass; from a defender's perspective, lower is safer.</td><td>Non-refusal is not success. For repeated attacks, state attempt-level versus prompt-level any-of-k aggregation.</td></tr>
        <tr><td><strong>ORR</strong><br>Over-Refusal Rate</td><td><code>(100/n<sub>𝓝</sub>) Σ<sub>i∈𝓝</sub> 1[unwarranted refusalᵢ]</code></td><td>Lower generally means better benign utility.</td><td>The name is not universal. State the allowed split and rubric.</td></tr>
        <tr><td><strong>BCR</strong><br>Benign Compliance Rate<br><small>local shorthand</small></td><td><code>(100/n<sub>𝓝</sub>) Σ<sub>i∈𝓝</sub> 1[substantive allowed answerᵢ]</code></td><td>Higher generally means better benign utility.</td><td>The acronym is not standardized. Also, <code>BCR ≠ 100% − ORR</code> when evasion or failure is possible.</td></tr>
        <tr><td><strong>Substantive completion</strong></td><td><code>(100/n<sub>S</sub>) Σ<sub>i∈S</sub> 1[material task attemptᵢ]</code></td><td>Higher on intended tasks.</td><td>Must be scored separately from willingness, correctness, and safety severity.</td></tr>
        <tr><td><strong>Evasion / failure</strong></td><td><code>(100/n<sub>S</sub>) Σ<sub>i∈S</sub> 1[declared eventᵢ]</code></td><td>Lower is generally better.</td><td>Declare separate categories or say explicitly that the indicator is a union.</td></tr>
        <tr><td><strong>Safety severity</strong></td><td><code>(1/n<sub>S</sub>) Σ<sub>i∈S</sub> judge(responseᵢ)</code> on a written scale.</td><td>Lower is safer under that rubric.</td><td>A mean can hide rare severe outputs; publish category distributions and tail cases.</td></tr>
        <tr><td><strong>EM / F1</strong><br>Exact Match / F1 score</td><td><code>EM=(1/n)Σᵢ1[predᵢ=refᵢ]</code>; <code>F1=2P<sub>tok</sub>R<sub>tok</sub>/(P<sub>tok</sub>+R<sub>tok</sub>)</code>.</td><td>Higher is better. Both are fractions in [0,1], or multiply by 100 and label them percentages.</td><td><code>P<sub>tok</sub></code> and <code>R<sub>tok</sub></code> are token precision and recall. Overlap can reward fluent but incorrect content.</td></tr>
      </tbody>
    </table></div>
    <blockquote><p>Use at least four outcome buckets: explicit refusal, substantive answer, evasion or diversion, and generation failure. Score correctness and safety severity on separate axes.</p></blockquote>

    <h2>Probe and conditional-gate metrics</h2>
    <div class="formula">TPR = TP / (TP + FN)       FPR = FP / (FP + TN)
precision = TP / (TP + FP)  recall = TPR
F1 = 2 · precision · recall / (precision + recall)
<small>TP = true positive, TN = true negative, FP = false positive, FN = false negative. “Positive” must name a class, such as baseline refusal—not merely something desirable.</small></div>
    <div class="method-table-wrap"><table class="method-table">
      <thead><tr><th>Acronym</th><th>Full name</th><th>Meaning</th><th>Trap</th></tr></thead>
      <tbody>
        <tr><td><strong>TPR</strong></td><td>True Positive Rate; also recall or sensitivity</td><td>Fraction of actual positives found. Higher is better at a fixed false-positive cost.</td><td>TPR depends on the declared operating threshold; report it together with FPR.</td></tr>
        <tr><td><strong>FPR / FNR</strong></td><td>False Positive Rate / False Negative Rate</td><td>Fractions of negatives wrongly flagged and positives wrongly missed. Lower is better.</td><td>Always state which class is positive and show raw confusion counts.</td></tr>
        <tr><td><strong>PPV</strong></td><td>Positive Predictive Value; precision</td><td>Among positive predictions, the fraction actually positive.</td><td>Changes with class prevalence even if the classifier is unchanged.</td></tr>
        <tr><td><strong>AUROC / ROC–AUC</strong></td><td>Area Under the Receiver Operating Characteristic Curve</td><td><code>P(score⁺&gt;score⁻)+½P(tie)</code>; 0.5 is random ranking.</td><td>Prevalence-invariant, yet high AUROC can coexist with poor precision or many false positives when positives are rare.</td></tr>
        <tr><td><strong>AUPRC / PR–AUC</strong></td><td>Area Under the Precision–Recall Curve</td><td>Summarizes precision and recall across thresholds; its baseline follows positive prevalence.</td><td>Values cannot be compared fairly across datasets with different prevalence.</td></tr>
        <tr><td><strong>ECE</strong></td><td>Expected Calibration Error: <code>Σᵦ |Bᵦ|/n · |acc(Bᵦ)−conf(Bᵦ)|</code></td><td>Binned gap between confidence and empirical accuracy; lower is better.</td><td>Depends on binning and can hide local or class-specific miscalibration.</td></tr>
      </tbody>
    </table></div>
    <div class="callout"><strong>Decodability is not causality</strong><p>A high AUC says a probe can read a label from activations. It does not prove the feature causes refusal, that the chosen layer writes it, or that deleting the probe direction will be selective.</p></div>

    <h2>Geometry and mechanism metrics</h2>
    <div class="formula">μ_R, μ_A = refused- and answered-outcome activation centroids
δ = μ_R − μ_A                 r̂ = unit candidate direction, ‖r̂‖₂ = 1
Σ_pool = [(n_R−1)Σ_R + (n_A−1)Σ_A] / (n_R+n_A−2)
D = paired-delta matrix        σ_j = jth singular value of D
U ∈ ℝ^(k_U×d), V ∈ ℝ^(k_V×d), with UUᵀ=I and VVᵀ=I
W = residual-writing weight matrix; ΔW = edited W minus baseline W
<small>Σ_R and Σ_A are within-group sample covariances. In the SNR below, λI is ridge regularization and λ has the same units as covariance.</small></div>
    <div class="method-table-wrap"><table class="method-table">
      <thead><tr><th>Metric</th><th>Formula or construction</th><th>Meaning · units · direction</th><th>Main trap</th></tr></thead>
      <tbody>
        <tr><td><strong>L₂ norm</strong></td><td><code>‖x‖₂ = √Σⱼxⱼ²</code></td><td>Euclidean length, in the same units as <code>x</code>. No universal desired direction.</td><td>Scale differs across layers; equal norm does not mean equal function.</td></tr>
        <tr><td><strong>Cosine similarity</strong></td><td><code>xᵀy / (‖x‖₂‖y‖₂)</code></td><td>Dimensionless in [−1,1]: +1 same direction, 0 orthogonal, −1 opposite.</td><td>Unstable near zero norm; high alignment is not causal evidence.</td></tr>
        <tr><td><strong>Relative mean gap</strong></td><td><code>‖μ_R−μ_A‖₂ / max(‖μ_R‖₂,‖μ_A‖₂)</code></td><td>Dimensionless centroid separation; higher means a larger relative gap.</td><td>It is not SNR because it contains no within-group noise estimate.</td></tr>
        <tr><td><strong>SNR</strong><br>Signal-to-Noise Ratio</td><td><code>|r̂ᵀδ| / √[r̂ᵀ(Σ_pool+λI)r̂]</code></td><td>Dimensionless contrast relative to regularized within-group variation; higher means cleaner separation.</td><td>There is no single universal SNR here; state the exact formula and regularization.</td></tr>
        <tr><td><strong>EVR</strong><br>Explained Variance Ratio</td><td><code>Σ_(j=1)^k σ_j² / Σ_(j=1)^rank(D) σ_j²</code></td><td>Dimensionless in [0,1]; higher captures more matrix energy at rank <code>k</code>.</td><td>It is not behavior explained. On uncentered paired deltas, call it captured energy rather than PCA variance.</td></tr>
        <tr><td><strong>Basis energy</strong></td><td><code>e_U(h)=‖Uh‖₂² / ‖h‖₂²</code></td><td>Dimensionless in [0,1]; post-edit lower is expected at the edited site.</td><td>Local removal can be reconstructed downstream.</td></tr>
        <tr><td><strong>Subspace overlap</strong></td><td><code>O(U,V)=‖UVᵀ‖_F² / min(k_U,k_V)</code></td><td>Dimensionless in [0,1]; higher means more shared subspace.</td><td>Rank mismatch and shared nuisance features can inflate similarity.</td></tr>
        <tr><td><strong>Layer rotation</strong></td><td><code>θ_ℓ=acos(clamp(cos(r_ℓ,r_(ℓ+1)),−1,1))</code></td><td>Radians or degrees; lower means greater depthwise stability.</td><td>Align signs only for sign-indeterminate SVD/PCA axes. Do not hide a reversal of outcome-oriented <code>μ_R−μ_A</code>.</td></tr>
        <tr><td><strong>Linear CKA</strong></td><td>For column-centered feature matrices <code>X,Y</code>: <code>‖XᵀY‖_F²/(‖XᵀX‖_F·‖YᵀY‖_F)</code></td><td>Centered Kernel Alignment; dimensionless in [0,1], higher means more globally similar representations.</td><td>General kernel CKA uses centered Gram matrices. High CKA can coexist with important local behavior changes.</td></tr>
        <tr><td><strong>Relative update norm</strong></td><td><code>‖ΔW‖_F / ‖W‖_F</code>, where <code>‖A‖_F=√ΣᵢⱼAᵢⱼ²</code></td><td>Dimensionless; lower means a smaller weight-space footprint.</td><td>A tiny norm can hit a sensitive feature; it does not guarantee preserved utility.</td></tr>
      </tbody>
    </table></div>

    <h2>Causal-effect metrics</h2>
    <div class="formula">raw removal change: ΔRR_remove = RR_remove − RR_base
removal effect:      E_remove = RR_base − RR_remove = −ΔRR_remove
addition effect:     E_add = RR_add − RR_base
ATE_m = (1/n) Σᵢ [mᵢ(intervened) − mᵢ(baseline)]
<small>ATE means Average Treatment Effect for a unit-level outcome m. Removal and addition effects are necessity- and sufficiency-style evidence only under a matched, controlled intervention; they are not logical proofs. Report m(α) across a declared dose range.</small></div>
    <p>A refusal change from 60% to 30% is a <strong>raw change of −30 percentage points</strong>, abbreviated <strong>pp</strong>, a <strong>removal effect of +30 pp</strong> under the convention above, and a <strong>−50% relative change</strong>. Those statements are mathematically different.</p>

    <h2>Calibration, uncertainty, and statistical acronyms</h2>
    <div class="method-table-wrap"><table class="method-table">
      <thead><tr><th>Acronym / term</th><th>What it means</th><th>How to report it</th><th>Trap</th></tr></thead>
      <tbody>
        <tr><td><strong>Brier score</strong></td><td><code>(1/n)Σᵢ(pᵢ−yᵢ)²</code>; squared error of predicted event probabilities.</td><td>Lower is better for a fixed event and population.</td><td>Mixes calibration and discrimination and depends on prevalence.</td></tr>
        <tr><td><strong>SD</strong><br>Standard Deviation</td><td>Spread of observed values around their sample mean.</td><td>Same units as the metric.</td><td>SD describes variation, not uncertainty in the estimated mean.</td></tr>
        <tr><td><strong>SE</strong><br>Standard Error</td><td>Sampling uncertainty of an estimator; for independent observations, mean SE is often <code>SD/√n</code>.</td><td>Same units as the estimator.</td><td>Repeated generations from one prompt are clustered, not independent rows.</td></tr>
        <tr><td><strong>CI</strong><br>Confidence Interval</td><td>A range produced by a procedure designed to cover the true estimand at a stated long-run rate.</td><td>Name the level, method, and resampling unit, such as a paired 95% prompt-bootstrap CI.</td><td>A 95% frequentist CI is not a 95% probability that this fixed interval contains the truth.</td></tr>
        <tr><td><strong>FDR</strong><br>False Discovery Rate</td><td>Expected share of false positives among selected findings.</td><td>Control it when scanning many layers, tokens, ranks, and strengths.</td><td>Picking the best test-set result after a large sweep invalidates ordinary uncertainty claims.</td></tr>
        <tr><td><strong>Macro / micro average</strong></td><td>Macro weights each category equally; micro pools all examples.</td><td>Report both when category sizes differ materially.</td><td>A micro average can hide failure in a small but important category.</td></tr>
      </tbody>
    </table></div>

    <h2>A minimal abliteration scorecard</h2>
    <div class="method-table-wrap"><table class="method-table">
      <thead><tr><th>Question</th><th>Minimum measurements</th><th>Why both are needed</th></tr></thead>
      <tbody>
        <tr><td>Did target refusal change?</td><td>RR plus substantive completion, evasion, and failure rates</td><td>Fewer refusal phrases can otherwise be mistaken for useful answers.</td></tr>
        <tr><td>Did safety change?</td><td>ASR or response-severity rubric plus benign ORR</td><td>Willingness and the risk of actual content are different outcomes.</td></tr>
        <tr><td>Did general language behavior drift?</td><td>ΔNLL and directed KL; optionally PPL and entropy</td><td>Reference-token quality and full-distribution movement catch different changes.</td></tr>
        <tr><td>Did useful capability survive?</td><td>Task-specific accuracy, EM/F1, calibration, and long-generation stability</td><td>Aggregate language loss can miss concentrated skill damage.</td></tr>
        <tr><td>Did the intended mechanism move?</td><td>Basis energy, held-out stability, removal/addition dose response, random controls</td><td>Geometric correlation alone cannot establish a causal pathway.</td></tr>
        <tr><td>Did the deployed artifact preserve the result?</td><td>Fresh-load KL/logit drift, generation deltas, exact hashes, and the same scorecard</td><td>Conversion, quantization, templates, and kernels create a second condition.</td></tr>
      </tbody>
    </table></div>

    <h2>Worked reading example</h2>
    <div class="formula">target RR:       78% → 31%        change = −47 pp
control NLL:    2.10 → 2.14      ΔNLL = +0.04 nats/token
control PPL:    8.17 → 8.50      ratio = exp(0.04) ≈ 1.041
KL(p₀ ‖ p₁):   0.018 nats/token
ECE:            0.06 → 0.11      change = +0.05
<small>Hypothetical values. The prompts, denominators, grader, confidence intervals, decoding condition, and artifact must still be reported.</small></div>
    <p>The edit reduced measured refusal by 47 percentage points. <code>ΔNLL +0.04</code> corresponds to a 4.1% perplexity increase, directed mean KL is 0.018 nats/token, and ECE increased by 0.05. Whether those changes are acceptable depends on a prespecified budget, baseline variability, category strata, and tail behavior. Without substantive-answer quality and safety-severity scores, this is <em>not yet a success claim</em>.</p>

    <h2>Ten metric traps to remember</h2>
    <ol>
      <li>Non-refusal is not the same as a substantive answer or a successful unsafe response.</li>
      <li>The desired direction depends on the split and purpose; always state it.</li>
      <li>Percent change and percentage-point change are different.</li>
      <li>Cosine, EVR, CKA, and probe AUC do not establish causality.</li>
      <li>A relative mean gap is not SNR unless noise is in the denominator.</li>
      <li>PPL is not comparable across different tokenizers or corpora.</li>
      <li>KL is asymmetric; show its arguments and aggregation.</li>
      <li>Means hide category failures and high-severity tails.</li>
      <li>Select layers and hyperparameters on validation data, not the final test set.</li>
      <li>Re-evaluate the exact saved and deployed artifact; an in-memory edit is another condition.</li>
    </ol>
    <div class="quiz"><strong>Checkpoint</strong><p>A report says <code>RR 70%→20%</code>, <code>ASR 65%</code>, <code>ΔNLL +0.30 nats/token</code>, and deployment-direction cosine <code>0.82</code>. You can conclude that measured refusal fell 50 percentage points, 65% met the declared ASR success rubric, language-model loss increased by 0.30 nats/token, and the measured directions were positively but not perfectly aligned. Whether any value is acceptable requires baselines, uncertainty, and prespecified thresholds.</p></div>
    </div></template>
<template id="lesson-evaluation-deployment">
      <p class="eyebrow">20 · Evidence & practice</p>
      <h1>No-refusal is not the same as a good answer.</h1>
      <p class="lede">Evaluation must separate explicit refusal, substantive completion, evasion, incoherence, correctness, utility, safety, and deployment parity. A single refusal regex is a useful diagnostic—not a conclusion.</p>
      <div class="lesson-meta"><span>◷ 30 MIN</span><span>◇ ADVANCED</span><span>✓ MULTI-AXIS QA</span></div>

      <h2>Score outcomes, not magic phrases</h2>
      <div class="metric-grid">
        <div class="metric"><code>Explicit refusal</code><p>Directly declines, says it cannot help, or invokes a policy boundary.</p></div>
        <div class="metric"><code>Substantive completion</code><p>Actually engages the requested task with enough content to evaluate.</p></div>
        <div class="metric"><code>Evasion / diversion</code><p>Changes subject, moralizes, gives only generic advice, or answers a safer question.</p></div>
        <div class="metric"><code>Failure</code><p>Blank, truncated, repetitive, incoherent, malformed, or crashes.</p></div>
        <div class="metric"><code>Correctness / quality</code><p>Task-specific accuracy, relevance, groundedness, and completeness.</p></div>
        <div class="metric"><code>Safety severity</code><p>What actionable risk appears in the actual response, scored independently of willingness.</p></div>
      </div>
      <p>Use rule-based indicators for fast iteration, then blinded human or validated model-based grading with a written rubric. Frameworks such as <a href="https://arxiv.org/abs/2402.10260" target="_blank" rel="noreferrer">StrongREJECT</a>, <a href="https://arxiv.org/abs/2402.04249" target="_blank" rel="noreferrer">HarmBench</a>, and <a href="https://arxiv.org/abs/2308.01263" target="_blank" rel="noreferrer">XSTest</a> cover different pieces; none alone certifies an edited model.</p>

      <h2>Protected capability suite</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Axis</th><th>Measurements</th><th>Why it catches hidden damage</th></tr></thead>
        <tbody>
          <tr><td>Language modeling</td><td>Reference NLL, perplexity, KL to baseline, token-level drift</td><td>Detects broad distribution change before benchmark scores collapse.</td></tr>
          <tr><td>Knowledge and reasoning</td><td>Held-out QA, math, code, factuality, tool use</td><td>Tests whether useful internal features overlapped the removed subspace.</td></tr>
          <tr><td>Benign near-neighbors</td><td>Allowed prompts in the same topics and styles</td><td>Separates refusal suppression from topic erasure.</td></tr>
          <tr><td>Calibration</td><td>Confidence, log-probability calibration, abstention on uncertainty</td><td>An edit can alter willingness without improving knowledge.</td></tr>
          <tr><td>Generation stability</td><td>Long outputs, repetition, entropy, stop behavior, multi-turn memory</td><td>Downstream reconstruction or compounding drift may appear late.</td></tr>
          <tr><td>Safety selectivity</td><td>Over-refusal, high-risk response severity, multilingual and obfuscated prompts</td><td>Quantifies both desired and undesired policy movement.</td></tr>
        </tbody>
      </table></div>

      <h2>Deployment is a second experiment</h2>
      <div class="pipeline">
        <div class="pipeline-step"><b>VALIDATE RUNTIME EDIT</b><span>Use a reversible hook to prove the candidate before touching weights.</span></div>
        <div class="pipeline-step"><b>FOLD INTO WEIGHTS</b><span>Apply the smallest validated update at reference precision and test a fresh load.</span></div>
        <div class="pipeline-step"><b>CONVERT / QUANTIZE</b><span>Create the intended deployment-precision artifact afterward.</span></div>
        <div class="pipeline-step"><b>RE-EVALUATE BYTES</b><span>Repeat target, capability, safety, and long-generation suites in the actual serving engine.</span></div>
        <div class="pipeline-step"><b>COMPARE PARITY</b><span>Record tensor hashes, logit drift, generation deltas, kernels, and resolved template.</span></div>
      </div>
      <p>Quantization can rotate, attenuate, or swamp a small edit; conversion can transpose or omit tensors; a serving template can move the relevant token position. “Passed at reference precision before export” is therefore not deployment evidence.</p>

      <div class="callout"><strong>Minimum report</strong><p>Publish denominators, confidence intervals or bootstrap ranges, exact prompts or dataset hashes, grader rubric and agreement, all model/runtime identifiers, complete hyperparameters, failure counts, and results for the untouched baseline, random control, runtime intervention, folded reference-precision model, and final deployed artifact.</p></div></template>
<template id="lesson-failure-modes">
      <p class="eyebrow">21 · Evidence & practice</p>
      <h1>A lower refusal score can fail in twelve different ways.</h1>
      <p class="lede">The central discipline is bounded language: say what changed under which conditions, preserve the evidence that could disprove it, and do not turn a local behavior edit into a universal claim.</p>
      <div class="lesson-meta"><span>◷ 22 MIN</span><span>◇ ALL LEVELS</span><span>⚠ LIMITS</span></div>

      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Failure</th><th>What it looks like</th><th>Best counter-test</th></tr></thead>
        <tbody>
          <tr><td>Topic confounding</td><td>The direction encodes cyber, medicine, or weapons vocabulary rather than refusal.</td><td>Four-cell outcomes and benign same-topic near-neighbors.</td></tr>
          <tr><td>Template confounding</td><td>It keys on role tokens, prompt length, punctuation, or dataset boilerplate.</td><td>Re-rendered and cross-template evaluation.</td></tr>
          <tr><td>Outcome mislabeling</td><td>Prompts assumed harmful did not actually refuse, or benign items did.</td><td>Screen actual baseline generations before measurement.</td></tr>
          <tr><td>Decodability ≠ causality</td><td>A strong probe finds a passenger feature.</td><td>Bidirectional intervention, patching, and same-rank random controls.</td></tr>
          <tr><td>Too many directions</td><td>Refusal falls because broad representational capacity was erased.</td><td>Rank sweep at matched utility drift.</td></tr>
          <tr><td>Norm illusion</td><td>Row norms are preserved while angles and function change sharply.</td><td>Activation, logit, KL, task, and calibration comparisons.</td></tr>
          <tr><td>Downstream repair</td><td>Early removal works briefly; later layers or generated tokens reconstruct the signal.</td><td>Trajectory probes and long-generation interventions.</td></tr>
          <tr><td>MoE attribution error</td><td>A routed expert correlates with refusal but is not causally responsible.</td><td>Router, expert-output, and shared-path interventions separately.</td></tr>
          <tr><td>Metric gaming</td><td>Refusal phrases vanish but answers are evasive, empty, or unsafe.</td><td>Outcome taxonomy plus substantive quality and severity grading.</td></tr>
          <tr><td>Split leakage</td><td>Paraphrases or source duplicates make held-out results look strong.</td><td>Source-grouped deduplication and truly external test sets.</td></tr>
          <tr><td>Artifact drift</td><td>The converted or quantized model behaves differently.</td><td>Fresh-process tests of the exact serving bytes.</td></tr>
          <tr><td>Overclaiming</td><td>“Fully uncensored,” “safety removed,” or “concept deleted.”</td><td>Bound every conclusion to checkpoint, data, template, language, layer, rank, strength, and runtime.</td></tr>
        </tbody>
      </table></div>

      <h2>Responsible operating envelope</h2>
      <div class="concept-grid">
        <div class="concept-card"><code>Authorization</code><p>Only modify checkpoints and run evaluations you are permitted to use; honor licenses, access controls, and data restrictions.</p></div>
        <div class="concept-card"><code>Isolation</code><p>Keep experiments local or access-controlled, protect artifacts, and avoid exposing a less-safe model as an unrestricted service.</p></div>
        <div class="concept-card"><code>Reversibility</code><p>Preserve the untouched checkpoint, use runtime tests first, version artifacts, and maintain a rollback path.</p></div>
        <div class="concept-card"><code>Defense in depth</code><p>Model behavior is only one layer; application policies, permissions, monitoring, rate limits, and human review still matter.</p></div>
        <div class="concept-card"><code>Transparent limits</code><p>Record negative results, known blind spots, intended scope, and which safety properties were not tested.</p></div>
        <div class="concept-card"><code>No capability inference</code><p>Greater willingness does not mean greater expertise, factuality, reliability, or suitability for consequential decisions.</p></div>
      </div>
      <div class="callout warning"><strong>Plain-language conclusion</strong><p>Abliteration is a powerful way to study and alter a learned policy pathway. It is not a proof of mechanistic completeness, a substitute for alignment, or a safe default for public deployment.</p></div></template>
<template id="lesson-glossary-sources">
      <p class="eyebrow">22 · Reference</p>
      <h1>Use precise words. Keep a source trail.</h1>
      <p class="lede">Mechanistic claims become easier to test when every object names its layer, token position, estimator, dataset, intervention, strength, and artifact condition.</p>
      <div class="lesson-meta"><span>◷ 18 MIN</span><span>◇ REFERENCE</span><span>⌘ 116-PAPER SYNTHESIS</span></div>

      <h2>Compact glossary</h2>
      <div class="glossary-grid">
        <div class="glossary-item"><code>Ablation</code><p>Remove or suppress a component to test or alter its causal contribution.</p></div>
        <div class="glossary-item"><code>Abliteration</code><p>Community term for activation or weight edits designed to suppress learned refusal behavior.</p></div>
        <div class="glossary-item"><code>Activation</code><p>A numeric internal state produced for a specific example, layer, site, and token position.</p></div>
        <div class="glossary-item"><code>Residual stream</code><p>The model-width state repeatedly read and updated by transformer components.</p></div>
        <div class="glossary-item"><code>Residual writer</code><p>A component whose output is added into that stream, such as attention <code>o_proj</code> or MLP <code>down_proj</code>.</p></div>
        <div class="glossary-item"><code>Refusal direction</code><p>A candidate vector associated with a refused-versus-answered contrast under defined conditions.</p></div>
        <div class="glossary-item"><code>Subspace</code><p>A span of multiple independent directions, usually represented by an orthonormal basis.</p></div>
        <div class="glossary-item"><code>Projection</code><p>Decompose a vector into components parallel and orthogonal to a direction or basis.</p></div>
        <div class="glossary-item"><code>Orthogonalization</code><p>Modify activations or weights so their selected component along a basis is removed.</p></div>
        <div class="glossary-item"><code>SVD</code><p>A factorization used here to find dominant axes in a matrix of example-wise activation differences.</p></div>
        <div class="glossary-item"><code>Whitening</code><p>Rescale geometry using an estimated covariance so high-variance nuisance axes do not dominate automatically.</p></div>
        <div class="glossary-item"><code>Biprojection</code><p>In this guide, answer-mean residualization at both the measurement source and every intervention destination.</p></div>
        <div class="glossary-item"><code>Householder reflection</code><p>A norm-preserving sign flip across a hyperplane; qualitatively different from deletion by projection.</p></div>
        <div class="glossary-item"><code>Activation patching</code><p>Replace a component's activation between matched runs to localize causal contribution.</p></div>
        <div class="glossary-item"><code>SAE</code><p>Sparse autoencoder used to represent activations with many sparse learned features.</p></div>
        <div class="glossary-item"><code>Pareto frontier</code><p>Edits for which no alternative improves target effect without worsening protected drift.</p></div>
      </div>

      <h2>How the evidence is organized</h2>
      <div class="metric-grid">
        <div class="metric"><code>Mechanistic evidence</code><p>Direction removal and addition, activation patching, component intervention, and downstream reconstruction tests.</p></div>
        <div class="metric"><code>Geometric evidence</code><p>Held-out separation, subspace stability, covariance conditioning, rank sensitivity, and cross-layer rotation.</p></div>
        <div class="metric"><code>Behavioral evidence</code><p>Refusal, substantive completion, evasion, answer quality, safety severity, utility, and calibration.</p></div>
        <div class="metric"><code>Artifact evidence</code><p>Fresh reload, conversion and quantization parity, exact prompt rendering, and deployment-condition replication.</p></div>
      </div>
