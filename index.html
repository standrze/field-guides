<template id="lesson-orientation">
      <p class="eyebrow">00 · Orientation</p>
      <h1>Refusal is a behavior. Abliteration is a model edit.</h1>
      <p class="lede">Abliteration is the community name for suppressing a model's learned refusal behavior by finding structure in its internal activations and intervening on that structure—temporarily at runtime or permanently in weights.</p>
      <div class="lesson-meta"><span>◷ 12 MIN</span><span>◇ CONCEPT FIRST</span><span>⊥ SOURCE-GROUNDED</span></div>

      <div class="scope-banner"><strong>Method-first scope</strong><p>This guide synthesizes a verified 116-paper research corpus plus implementation evidence, but it is organized around mathematical method families—not software packages or preset names. Each method is compared by its assumptions, operator, practical advantages, and failure modes.</p></div>

      <h2>The careful definition</h2>
      <p>Instruction-tuned models can learn internal features that correlate with refusing a request. The canonical method estimates a direction from contrasting activation averages and removes the component parallel to that direction. The original research calls this <strong>directional ablation</strong> at runtime and <strong>weight orthogonalization</strong> when folded into a checkpoint. “Abliteration” is the memorable community label.</p>
      <div class="concept-grid">
        <div class="concept-card"><code>What it can change</code><p>The probability, style, timing, or category of refusal behavior on prompts resembling the measurement set.</p></div>
        <div class="concept-card"><code>What it does not prove</code><p>That harmful knowledge was erased, every safeguard disappeared, answers became correct, or unrelated capabilities remained intact.</p></div>
      </div>

      <h2>Keep these techniques separate</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Technique</th><th>Where it acts</th><th>Training?</th><th>Same as abliteration?</th></tr></thead>
        <tbody>
          <tr><td>Prompt jailbreak</td><td>Input text / conversation</td><td>No</td><td>No—weights and internal maps stay unchanged.</td></tr>
          <tr><td>Activation steering</td><td>Hidden state during inference</td><td>No</td><td>Related; subtraction or projection can be runtime abliteration.</td></tr>
          <tr><td>Weight orthogonalization</td><td>Residual-writing matrices</td><td>No gradients</td><td>Canonical permanent abliteration.</td></tr>
          <tr><td>SFT, DPO, RLHF, LoRA</td><td>Learned parameter update</td><td>Yes</td><td>Adjacent; may remove, restore, or reshape refusal through training.</td></tr>
          <tr><td>Unlearning</td><td>Knowledge or behavior objective</td><td>Usually</td><td>No. Refusal suppression does not establish knowledge removal.</td></tr>
        </tbody>
      </table></div>

      <h2>The learning path</h2>
      <div class="pipeline">
        <div class="pipeline-step"><b>01 · ANATOMY</b><span>Tokens, transformer blocks, residual streams, attention, MLPs, and logits.</span></div>
        <div class="pipeline-step"><b>02 · DISCOVERY</b><span>Contrasts, hidden states, directions, subspaces, and layer selection.</span></div>
        <div class="pipeline-step"><b>03 · INTERVENTION</b><span>Projection, biprojection, norm preservation, sparse and conditional edits.</span></div>
        <div class="pipeline-step"><b>04 · TRADEOFFS</b><span>Single versus rank-k, global versus conditional, dense versus sparse, runtime versus permanent.</span></div>
        <div class="pipeline-step"><b>05 · PROOF</b><span>Causal tests, capability checks, safety evaluation, uncertainty, and artifact parity.</span></div>
      </div>

      <div class="callout warning"><strong>Responsible scope</strong><p>Removing safeguards can increase misuse risk. Treat these methods as controlled interpretability and model-evaluation tools: use models you are authorized to modify, isolate experiments, keep an untouched baseline, and never confuse lower refusal with safe or correct behavior.</p></div>
      <div class="quiz"><strong>Checkpoint</strong><p>If an edited model stops saying “I cannot” but produces vague nonsense, abliteration changed a surface outcome; it did not demonstrate useful capability. That distinction drives the rest of this course.</p></div></template>
<template id="lesson-transformer-layers">
      <p class="eyebrow">01 · Model anatomy</p>
      <h1>A transformer is a stack of residual updates.</h1>
      <p class="lede">Every token position carries a vector with <code>d_model</code> coordinates. A decoder-only model repeatedly lets attention and an MLP add information to that vector, then turns the final vector into next-token scores.</p>
      <div class="lesson-meta"><span>◷ 18 MIN</span><span>◇ FOUNDATION</span><span>↧ TOKEN → LOGITS</span></div>

      <div class="stack-diagram" role="img" aria-label="Decoder-only transformer stack">
        <div class="stack-stage signal"><strong>Token IDs</strong><span>A tokenizer maps text to integers; the chat template adds role and control tokens.</span></div>
        <div class="stack-stage"><strong>Embedding</strong><span>Each token ID selects a learned vector in the shared model width.</span></div>
        <div class="stack-stage repeat"><strong>Block × L</strong><div class="block-parts"><span>Normalization</span><span>Self-attention · Q, K, V → O</span><span>Residual add</span><span>MLP · gate/up → down</span><span>Residual add</span></div></div>
        <div class="stack-stage"><strong>Final norm</strong><span>RMSNorm or LayerNorm stabilizes the last residual state.</span></div>
        <div class="stack-stage"><strong>LM head</strong><span>The unembedding reads the state and produces one logit per vocabulary token.</span></div>
      </div>

      <h2>Inside one pre-norm block</h2>
      <div class="formula">uˡ = xˡ + Attention(Norm(xˡ))
xˡ⁺¹ = uˡ + MLP(Norm(uˡ))
<small>Architectures vary, but the central idea is stable: attention and the MLP write updates into a shared residual stream.</small></div>
      <p><strong>Attention</strong> moves information between token positions. Queries decide what a position wants, keys describe what other positions offer, values carry content, and the output projection <code>o_proj</code> writes the combined result back to model width. <strong>The MLP</strong> independently transforms each position through a wider intermediate space; its output or <code>down_proj</code> writes back to model width.</p>

      <h2>Readers versus writers</h2>
      <div class="concept-grid">
        <div class="concept-card"><code>Internal readers / transforms</code><p>Q, K, V, MLP gate, and MLP up matrices inspect or transform the current state. Whatever their tensor width, these outputs are not directly added to the residual stream.</p></div>
        <div class="concept-card"><code>Residual writers</code><p>Embeddings, attention output projections, MLP output/down projections, and some biases emit vectors in <code>d_model</code> space.</p></div>
      </div>
      <p>Weight abliteration targets writers because preventing a writer from producing a direction can mimic removing that direction from activations. The LM head is a <em>reader</em>: it maps residual space to vocabulary space.</p>

      <h2>Dense and mixture-of-experts blocks</h2>
      <p>A dense model runs one MLP per block. A mixture-of-experts (MoE) model uses a router to select a small set of expert MLPs and combines their outputs. The residual stream remains shared, but refusal can involve router decisions, expert-specific writers, shared experts, and attention. Editing one conveniently named <code>down_proj</code> is not automatically sufficient.</p>
      <div class="callout"><strong>Architecture rule</strong><p>Reason from tensor shapes and the forward pass, not from a favorite model's parameter names. GQA, MQA, RoPE, hybrid attention, MoE, and multimodal fusion alter the plumbing without changing the need to identify every relevant residual writer.</p></div>
      <div class="quiz"><strong>Checkpoint</strong><p>Why is <code>o_proj</code> a natural target while <code>q_proj</code> is not? Because <code>o_proj</code> emits into the residual stream; <code>q_proj</code> creates an internal attention representation.</p></div></template>
<template id="lesson-residual-stream">
      <p class="eyebrow">02 · Model anatomy</p>
      <h1>The residual stream is the model's shared workspace.</h1>
      <p class="lede">A refusal direction is not stored in a file named “refusal.” It is a pattern in the evolving vectors carried between and within transformer blocks.</p>
      <div class="lesson-meta"><span>◷ 16 MIN</span><span>◇ FOUNDATION</span><span>◎ LAYER × TOKEN</span></div>

      <h2>Three common observation points</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Name</th><th>Location</th><th>What it contains</th></tr></thead>
        <tbody>
          <tr><td><code>resid_pre</code></td><td>Start of block</td><td>Everything written by embeddings and previous blocks.</td></tr>
          <tr><td><code>resid_mid</code></td><td>After attention residual add</td><td>Pre-state plus the current block's attention contribution.</td></tr>
          <tr><td><code>resid_post</code></td><td>After MLP residual add</td><td>The complete output passed to the next block.</td></tr>
        </tbody>
      </table></div>
      <p>Refusal-direction studies have inspected all three sites. Many general model interfaces expose only block-boundary hidden states, while hook-based methods can isolate attention and MLP contributions. Those are different measurements and should not share a layer label without qualification.</p>

      <h2>A hidden state has three axes</h2>
      <div class="formula">hidden_state.shape = [batch, sequence_position, d_model]
candidate = hidden_state[:, chosen_position, :]
<small>A “layer direction” is incomplete without the token position, prompt renderer, and checkpoint that produced it.</small></div>
      <p>The canonical paper measures candidates at post-instruction token positions. Other variants use the last user token, first assistant token, or a trajectory across generated tokens. These answer different questions: prompt taps study policy formation; response taps study policy realization and downstream reconstruction.</p>

      <h2>Indexing is a trap</h2>
      <p>Many model APIs include an embedding state at index 0 followed by one output per transformer layer. Treating the first returned state as “block 0” can shift every label and omit the final block. Verify an exported index against a known module hook before comparing layer results.</p>

      <h2>Runtime hook versus folded edit</h2>
      <div class="concept-grid">
        <div class="concept-card"><code>Activation intervention</code><p>A hook projects every selected hidden state during each forward pass. Reversible and ideal for causal testing.</p></div>
        <div class="concept-card"><code>Weight intervention</code><p>Projection is folded into writer matrices once. Portable as a checkpoint, but equivalence depends on complete and correctly oriented targets.</p></div>
      </div>
      <div class="callout warning"><strong>Equivalence condition</strong><p>Runtime ablation and weight orthogonalization are equivalent only when the same direction is removed from every relevant residual source, including the initial residual where required. A targeted <code>o_proj</code> + <code>down_proj</code> editor is an approximation to that all-writer statement.</p></div></template>
<template id="lesson-refusal-mechanism">
      <p class="eyebrow">03 · Model anatomy</p>
      <h1>Recognition, refusal, and capability are not one thing.</h1>
      <p class="lede">A dataset label like “harmful” bundles several causal variables. If you subtract its mean from a benign mean, the resulting vector can contain topic, risk recognition, refusal execution, style, and answer capability all at once.</p>
      <div class="lesson-meta"><span>◷ 20 MIN</span><span>◇ INTERMEDIATE</span><span>⌁ MECHANISM</span></div>

      <h2>Four variables to keep apart</h2>
      <div class="metric-grid">
        <div class="metric"><code>T · Topic</code><p>What domain the conversation concerns: cyber, cooking, medicine, finance, or something else.</p></div>
        <div class="metric"><code>H · Harm assessment</code><p>Whether the model represents the request as risky, disallowed, dual-use, or benign.</p></div>
        <div class="metric"><code>R · Refusal decision</code><p>The internal policy choice to withhold, redirect, hedge, or answer.</p></div>
        <div class="metric"><code>C · Capability</code><p>Whether the model can construct a correct and substantive answer at all.</p></div>
      </div>

      <h2>A useful causal scaffold</h2>
      <div class="pipeline">
        <div class="pipeline-step"><b>DETECT</b><span>Represent topic, risk, policy context, roles, and conversation history.</span></div>
        <div class="pipeline-step"><b>GATE</b><span>Select or suppress a policy pathway; in MoE models this may interact with routing.</span></div>
        <div class="pipeline-step"><b>WRITE</b><span>Attention, MLPs, or experts inject a refusal feature into the residual stream.</span></div>
        <div class="pipeline-step"><b>AMPLIFY</b><span>Later components strengthen, repair, or oppose the developing trajectory.</span></div>
        <div class="pipeline-step"><b>REALIZE</b><span>The decoder produces refusal, compliance, hedging, moralizing, diversion, or failure.</span></div>
      </div>
      <p>This scaffold is not claimed to be a literal five-module circuit in every model. It is a set of distinct causal questions. A selective edit usually wants the <strong>execution/writer</strong> stage: change refusal without deleting topic or harm recognition and without damaging capability.</p>

      <h2>From one arrow to richer geometry</h2>
      <p><a href="https://arxiv.org/abs/2406.11717" target="_blank" rel="noreferrer">Arditi et al.</a> established that a single direction can mediate refusal across many tested models: removing it reduces refusal and adding it induces refusal. That is a strong historical baseline—not a theorem that every checkpoint, category, language, token, and refusal style uses one universal axis.</p>
      <blockquote><p>Across the literature, the more durable picture is a conditional, time-dependent policy that can involve multiple directions, sparse components, routing circuits, and answer capability that remains partly separable from refusal execution.</p></blockquote>

      <h2>The minimum outcome table</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Prompt assessment</th><th>Refused outcome</th><th>Answered outcome</th></tr></thead>
        <tbody>
          <tr><td>Harmful / restricted</td><td><code>μHR</code></td><td><code>μHA</code></td></tr>
          <tr><td>Benign / allowed</td><td><code>μBR</code> · over-refusal</td><td><code>μBA</code></td></tr>
        </tbody>
      </table></div>
      <div class="formula">refusal effect = ½[(μHR − μHA) + (μBR − μBA)]
harm effect    = ½[(μHR − μBR) + (μHA − μBA)]
<small>A four-cell design attempts to isolate outcome from harm recognition instead of assuming the dataset label is the mechanism.</small></div>
      <div class="quiz"><strong>Checkpoint</strong><p>If an edit lowers refusal on cyber prompts by deleting cyber vocabulary, it succeeded on a superficial metric and failed mechanistically. Topic probes, technical correctness, and benign-cyber controls reveal the mistake.</p></div></template>
<template id="lesson-geometry-language">
      <p class="eyebrow">04 · Model anatomy</p>
      <h1>A direction is a hypothesis about behavior.</h1>
      <p class="lede">The math is compact. The experimental assumptions behind it are not. Learn what each geometric operation says—and what it cannot say.</p>
      <div class="lesson-meta"><span>◷ 22 MIN</span><span>◇ INTERMEDIATE</span><span>∑ LINEAR ALGEBRA</span></div>

      <h2>Core objects</h2>
      <div class="glossary-grid">
        <div class="glossary-item"><code>Activation h</code><p>One model-width vector at a particular layer, token position, checkpoint, and rendered prompt.</p></div>
        <div class="glossary-item"><code>Centroid μ</code><p>The component-wise average of a group of activations.</p></div>
        <div class="glossary-item"><code>Direction r</code><p>A vector whose orientation is tested as a candidate behavioral feature.</p></div>
        <div class="glossary-item"><code>Subspace B</code><p>Several independent directions, stored here as the rows of an orthonormal basis.</p></div>
        <div class="glossary-item"><code>Dot product hᵀr</code><p>A signed coordinate: how strongly activation <code>h</code> points along <code>r</code>.</p></div>
        <div class="glossary-item"><code>Cosine similarity</code><p>Angular alignment after ignoring magnitude; 1 same direction, 0 orthogonal, −1 opposite.</p></div>
      </div>

      <div class="scope-banner"><strong>Notation</strong><p><code>h</code> is a column activation; <code>μR, ΣR</code> and <code>μA, ΣA</code> describe refused and answered groups; <code>B</code> is an orthonormal row basis; <code>G</code> is an arbitrary row basis; <code>P</code> is a projector; and <code>s_ref</code> is a scalar refusal score. Harmful/benign labels appear only in the four-cell causal design.</p></div>

      <h2>One-direction projection</h2>
      <div class="formula">r̂ = r / ‖r‖₂
projection onto r̂:     (hᵀr̂)r̂
remove that component: h′ = h − α(hᵀr̂)r̂
<small>α = 0 is identity; α = 1 is exact orthogonal removal; 0 &lt; α &lt; 1 is partial attenuation. Overshoot is no longer ordinary ablation.</small></div>
      <p>Projection preserves everything orthogonal to the chosen direction in Euclidean coordinates. It does <em>not</em> guarantee preserved language capability: useful features can overlap the direction, and the model's locally meaningful metric may not be Euclidean.</p>

      <h2>Several directions</h2>
      <div class="formula">store basis vectors as rows: B ∈ ℝᵏˣᵈ,  BBᵀ = Iₖ
orthogonal span projector: P = BᵀB
h′ = (I − P)h
arbitrary row basis G: P = Gᵀ(GGᵀ)⁺G
<small>This row-basis convention is used throughout the guide. Sequentially removing correlated directions is order-dependent and is not automatically equivalent to projecting out their joint span.</small></div>
      <p><strong>SVD</strong> factorizes a matrix into orthogonal directions ranked by captured variation. <strong>PCA</strong> applies that idea to centered variance. These can recover a low-rank refusal subspace—but the top variance direction is not necessarily the most causal or selective one.</p>

      <h2>Four operations people confuse</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Operation</th><th>What it changes</th><th>What it is not</th></tr></thead>
        <tbody>
          <tr><td>Unit normalization</td><td>Sets one vector's length to 1.</td><td>Not covariance whitening.</td></tr>
          <tr><td>LayerNorm / RMSNorm</td><td>Normalizes model activations during the forward pass.</td><td>Not a learned concept eraser.</td></tr>
          <tr><td>Winsorization / clipping</td><td>Caps outlier coordinates before estimating a mean.</td><td>Not sparsification and not whitening.</td></tr>
          <tr><td>Whitening</td><td>Uses covariance to make ordinary control variation isotropic.</td><td>Not merely dividing by a norm.</td></tr>
          <tr><td>Norm preservation</td><td>Restores each chosen residual-output vector or activation to its prior length.</td><td>Does not restore lost information or guarantee capability.</td></tr>
        </tbody>
      </table></div>

      <h2>Why covariance matters</h2>
      <p>If a candidate direction lies along naturally high-variance benign behavior, ordinary projection may cause disproportionate damage. Whitening with a protected covariance asks which differences are large <em>relative to ordinary variation</em>. LEACE and generalized eigenvector methods formalize covariance-aware erasure, but require many representative samples and stable regularization.</p>
      <div class="callout"><strong>Language rule</strong><p>Say “we removed the measured projection” or “linear decoding fell on this evaluation set.” Do not say a concept was deleted unless the experiment survives fresh nonlinear probes, causal tests, generation, reload, and deployment transforms.</p></div>
      <div class="quiz"><strong>Checkpoint</strong><p>High cosine similarity between refused and answered means says their centroids point similarly. It does not make their difference noise; you still need within-group variance, held-out stability, and causal tests.</p></div></template>
<template id="lesson-measurement-design">
      <p class="eyebrow">05 · Core workflow</p>
      <h1>The dataset is part of the intervention.</h1>
      <p class="lede">There is no checkpoint-only refusal vector waiting to be discovered. A measured direction depends on the prompts, actual outputs, chat template, token position, layer, pooling, precision, and estimator.</p>
      <div class="lesson-meta"><span>◷ 24 MIN</span><span>◇ INTERMEDIATE</span><span>▦ MEASURE</span></div>

      <h2>The canonical estimate</h2>
      <div class="formula">μRˡ = mean hidden state for actually refused examples at layer l
μAˡ = mean hidden state for matched answered examples at layer l
rˡ  = μRˡ − μAˡ
r̂ˡ = rˡ / ‖rˡ‖₂
<small>Historical harmful-minus-benign datasets approximate this contrast but can mix refusal with topic and risk recognition. Calling any contrast a refusal direction is a causal hypothesis.</small></div>

      <h2>Label what the model actually did</h2>
      <p>A prompt placed in a “harmful” file may be answered; a benign prompt may be over-refused. If you fit only the intended labels, the contrast mixes harm with outcome. Render the exact prompt, save the complete baseline response, and classify it as refusal, substantive completion, or evasive/failed other. When possible, build all four harmful/benign × refused/answered cells.</p>
      <div class="callout"><strong>Contrast discipline</strong><p>Match length, language, format, source, and chat role enough to reduce nuisance signal, but do not make controls so topically identical that subtraction cancels the mechanism of interest. Learn or residualize topic separately.</p></div>

      <h2>Measurement choices change the method</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Choice</th><th>Practical advantage</th><th>Practical disadvantage</th></tr></thead>
        <tbody>
          <tr><td>Post-instruction token</td><td>Measures the state immediately before the answer begins; cheap and easy to align.</td><td>Misses refusal structure that emerges or repairs itself during generation.</td></tr>
          <tr><td>Generated-token trajectory</td><td>Reveals timing, downstream reconstruction, and changing refusal style.</td><td>Costs more memory and introduces sampling-dependent paths.</td></tr>
          <tr><td>Difference of means</td><td>Stable, simple, and needs relatively few samples.</td><td>Collapses multimodal structure and is sensitive to confounded labels.</td></tr>
          <tr><td>Paired differences</td><td>Cancels prompt-specific topic and form when controls are truly matched.</td><td>Poor matches turn length, style, or content differences into the signal.</td></tr>
          <tr><td>Per-coordinate winsorization across examples</td><td>Limits dataset-tail outliers before computing each coordinate's mean.</td><td>Coordinate-wise and basis-dependent; ignores multivariate structure.</td></tr>
          <tr><td>Within-activation coordinate clipping</td><td>Limits unusually large coordinates inside each individual state.</td><td>Also basis-dependent and can erase genuine sparse features; it is a different estimator.</td></tr>
          <tr><td>Covariance estimate</td><td>Supports whitening and minimum-distortion erasure.</td><td>Needs far more representative data and careful shrinkage.</td></tr>
          <tr><td>Quantized forward pass</td><td>Lowers measurement memory and matches some deployment runtimes.</td><td>May rotate or attenuate directions relative to the full-precision model.</td></tr>
        </tbody>
      </table></div>

      <h2>Robust and covariance-aware estimators</h2>
      <div class="formula">paired mean:     r = (1/n) Σᵢ(hᴿᵢ − hᴬᵢ)
Fisher / LDA:    w = (ΣR + ΣA + λI)⁻¹(μR − μA)
shrinkage:       Σ̃ = (1−γ)Σ̂ + γτI
<small>LDA discounts directions with large within-class variance. It is not the same as SVD of paired deltas or whitening a multi-direction subspace.</small></div>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Estimator</th><th>Advantage</th><th>Disadvantage</th><th>Best diagnostic</th></tr></thead>
        <tbody>
          <tr><td>Ordinary mean</td><td>Lowest complexity and variance under clean light-tailed data.</td><td>Sensitive to outliers and mixture imbalance.</td><td>Bootstrap direction cosine and source-held-out behavior.</td></tr>
          <tr><td>Paired mean</td><td>Removes pair-shared nuisance structure.</td><td>Depends completely on match quality.</td><td>Permute pairings and compare the learned direction.</td></tr>
          <tr><td>Trimmed / winsorized mean</td><td>Cheap robustness by trimming examples or dataset tails per coordinate.</td><td>Threshold and coordinate basis can remove genuine rare signal.</td><td>State the clipping axis; sweep trim fraction and inspect causal stability.</td></tr>
          <tr><td>Median-of-means</td><td>Strong outlier robustness without estimating full covariance.</td><td>Block partition adds randomness; less efficient on clean Gaussian data.</td><td>Repeat blockings and report angular spread.</td></tr>
          <tr><td>Geometric median</td><td>Robust multivariate center with no privileged coordinate system.</td><td>Iterative and can ignore meaningful minority modes.</td><td>Compare per-category residuals and convergence.</td></tr>
          <tr><td>Fisher / LDA</td><td>Finds separation relative to pooled within-class noise.</td><td>High-dimensional covariance is unstable without shrinkage.</td><td>Nested selection of <code>λ</code> and eigenvalue stability.</td></tr>
        </tbody>
      </table></div>

      <h2>Sampling checklist</h2>
      <ul class="checklist">
        <li>Use disjoint fitting, model-selection, and final test prompts.</li>
        <li>Stratify by source, semantic family, category, language, and actual outcome.</li>
        <li>Record checkpoint and tokenizer revisions, template text, token IDs, role-relative position, precision, and seed.</li>
        <li>Measure enough examples for stable means; covariance methods need substantially more than a single direction.</li>
        <li>Verify padding side and that the sampled position means the same thing for every batch item.</li>
        <li>Keep an untouched baseline response set for paired evaluation.</li>
      </ul>

      <h2>Quantized measurement is a separate condition</h2>
      <p>A direction estimated from a 4-bit or 8-bit forward pass is a direction for that numerical model. Applying it to full-precision weights assumes cross-precision geometric transfer. Measure cosine stability and behavioral transfer in both directions; do not treat lower precision as a transparent memory optimization.</p>
      <div class="quiz"><strong>Checkpoint</strong><p>A bigger dataset does not rescue a confounded contrast. Ten thousand cyber-versus-cooking prompts can estimate the cyber topic direction extremely well while completely missing refusal execution.</p></div></template>
<template id="lesson-layer-analysis">
      <p class="eyebrow">06 · Core workflow</p>
      <h1>Decodability is not editability.</h1>
      <p class="lede">A layer can make refusal easy to predict yet be a poor place to intervene. Analysis should locate stable candidates; addition, removal, and patching decide whether they matter causally.</p>
      <div class="lesson-meta"><span>◷ 22 MIN</span><span>◇ INTERMEDIATE</span><span>⌁ ANALYZE</span></div>

      <h2>Useful layerwise diagnostics</h2>
      <div class="metric-grid">
        <div class="metric"><code>Mean norms</code><p>Lengths of refused mean, answered mean, and their raw difference at each layer.</p></div>
        <div class="metric"><code>Cosines</code><p>Angular alignment among outcome means, adjacent-layer directions, and nuisance directions.</p></div>
        <div class="metric"><code>Relative mean gap</code><p><code>‖r‖ / max(‖μR‖, ‖μA‖)</code>. This is scale-normalized—not a signal-to-noise ratio.</p></div>
        <div class="metric"><code>Within-class scatter</code><p>Variance around each outcome mean; needed for Fisher separation and uncertainty.</p></div>
        <div class="metric"><code>Answer-mean overlap</code><p>How much of the raw contrast lies along the answer-side mean; motivates but does not validate residualization.</p></div>
        <div class="metric"><code>Layer rotation</code><p>Cosine similarity and angular change between consecutive layer directions reveal stable or rapidly changing regions.</p></div>
      </div>

      <div class="layer-strip" aria-label="Illustrative 36-layer model with middle-late candidate region">
        <i>0</i><i>3</i><i>6</i><i>9</i><i>12</i><i class="candidate">15</i><i class="candidate">18</i><i class="candidate">21</i><i class="candidate">24</i><i>27</i><i>30</i><i>33</i>
      </div>
      <p class="layer-caption">ILLUSTRATION ONLY · CANDIDATE LAYERS ARE CHECKPOINT-, DATA-, POSITION-, AND METHOD-SPECIFIC.</p>

      <h2>How the original study selected a direction</h2>
      <p>The canonical work evaluated candidates by intervening, not by norm alone. A candidate had to reduce harmful-prompt refusal, be sufficient to induce refusal when added, keep benign-prompt KL below a threshold, and originate before the final fifth of the network. Selected layers differed by model family.</p>

      <h2>Source layer and destination layer are different choices</h2>
      <p>A <strong>measurement/source layer</strong> supplies the direction. A <strong>destination layer</strong> is where an activation or writer matrix is edited. You can use a local basis per destination, reuse one source across a depth range, or blend adjacent sources. Reuse is cheaper and smoother; local bases track rotation but need more data and can overfit layer noise.</p>

      <h2>A stronger selection ladder</h2>
      <ol>
        <li>Rank stable candidates with held-out geometry and nuisance controls.</li>
        <li><strong>Add</strong> the direction: does refusal rise on benign prompts?</li>
        <li><strong>Remove</strong> it: does refusal fall on target prompts?</li>
        <li>Patch matched answer-side activations into a refusing run and perform the reverse patch.</li>
        <li>Compare against random directions of the same rank and norm.</li>
        <li>Select the smallest layer/token/component set on the target-effect versus protected-drift frontier.</li>
      </ol>
      <div class="callout warning"><strong>Index audit</strong><p>Transformers hidden-state tuples commonly start with the embedding output. Verify whether a saved index denotes an embedding boundary, block output, or actual module number before using it as a source for a destination block.</p></div></template>
<template id="lesson-standard-abliteration">
      <p class="eyebrow">07 · Core workflow</p>
      <h1>Remove one coordinate from the model's workspace.</h1>
      <p class="lede">Standard abliteration asks every selected residual state—or every selected writer—to have zero component along a unit refusal direction.</p>
      <div class="lesson-meta"><span>◷ 20 MIN</span><span>◇ INTERMEDIATE</span><span>⊥ RANK ONE</span></div>

      <h2>Runtime directional ablation</h2>
      <div class="formula">P⊥ = I − r̂r̂ᵀ
h′ = P⊥h = h − (hᵀr̂)r̂
<small>Apply with forward hooks at selected layer/token sites. It is reversible, observable, and the cleanest way to test causality before editing weights.</small></div>
      <p>Removing the direction at every layer and every token prevents the state from carrying that coordinate, but a smaller schedule may preserve more utility. Downstream blocks can also reconstruct a removed feature—the “hydra” or self-repair problem—so single-site success must be tested over a full generation.</p>

      <h2>Permanent weight orthogonalization</h2>
      <div class="formula">for a residual writer W ∈ ℝᵈᵐᵒᵈᵉˡ × ᵈⁱⁿ:
W′ = (I − r̂r̂ᵀ)W = W − r̂(r̂ᵀW)
<small>After the edit, each output column is orthogonal to r̂, so that writer cannot emit the direction.</small></div>
      <p>The exact all-writer construction includes every matrix and bias that writes into residual space, plus the initial residual source where applicable. A targeted approximation edits only the dominant per-block attention and MLP output writers. All-writer editing better matches runtime projection; targeted editing touches fewer parameters and may preserve more utility, but can leave alternate writers able to reconstruct the feature.</p>

      <h2>Scaling the edit</h2>
      <div class="formula">W′ = W − αr̂(r̂ᵀW)
α = 0   → unchanged
0&lt;α&lt;1 → partial attenuation
α = 1   → exact projection
α &gt; 1  → overshoot / sign change, not ordinary removal
α &lt; 0  → amplification or induction-like behavior</div>
      <p>Strength can be global, layer-specific, or token-specific. Negative strength changes subtraction into amplification, while <code>α &gt; 1</code> crosses the projection plane. These are useful causal stress tests, not evidence that refusal is a perfectly symmetric scalar feature.</p>

      <h2>Why the rank-one update is attractive</h2>
      <ul><li>No gradients or harmful target completions are required.</li><li>The edit is cheap relative to training and easy to inspect.</li><li>Runtime and folded forms have a precise mathematical relationship.</li><li>Strength, layer span, and source direction are controllable.</li></ul>
      <div class="callout warning"><strong>What projection preserves</strong><p>It preserves the Euclidean orthogonal complement of <code>r̂</code>, not “all capabilities.” If refusal overlaps planning, style, multilingual features, or ordinary caution, those behaviors can move too.</p></div>
      <div class="quiz"><strong>Checkpoint</strong><p>Stopping a writer from producing <code>r̂</code> is different from deleting every neuron correlated with refusal. A direction is a coordinate in residual space, not a named physical module.</p></div></template>
<template id="lesson-projected-norm">
      <p class="eyebrow">08 · Core workflow</p>
      <h1>Three switches produce several method names.</h1>
      <p class="lede">These variants differ along three independent axes: how the direction is cleaned at its source, how it is adapted to a destination, and whether edited weight magnitudes are restored.</p>
      <div class="lesson-meta"><span>◷ 24 MIN</span><span>◇ ADVANCED</span><span>◇ GEOMETRIC VARIANTS</span></div>

      <h2>1 · Source answer-mean residualization</h2>
      <div class="formula">âₛ = μA,ₛ / ‖μA,ₛ‖
rₛ = normalize[(I − âₛâₛᵀ)(μR,ₛ − μA,ₛ)]
<small>Two-pass Gram–Schmidt can improve numerical orthogonality. This heuristic removes overlap with the answer-side mean at the measurement source.</small></div>

      <h2>2 · Destination answer-mean residualization</h2>
      <div class="formula">âₗ = μA,ₗ / ‖μA,ₗ‖
rₛ→ₗ = normalize[(I − âₗâₗᵀ)rₛ]
<small>In the convention used here, “biprojected” means answer-mean residualization once at the source and again for every destination. It does not vaguely mean projecting both sides of a weight matrix.</small></div>

      <h2>3 · Norm preservation</h2>
      <div class="formula">for each residual-output vector wⱼ:
qⱼ = (I − αr̂r̂ᵀ)wⱼ
w′ⱼ = ‖wⱼ‖₂ · qⱼ / ‖qⱼ‖₂      when ‖qⱼ‖₂ &gt; ε
<small>If <code>y=Wx</code>, residual-output vectors are columns of W. Define an explicit fallback when projection sends a vector to zero.</small></div>
      <p>At <code>α=1</code>, multiplying each projected residual-output vector by one scalar preserves its orthogonality. By contrast, anisotropically rescaling output coordinates—such as independently restoring stored rows in an <code>[out,in]</code> tensor—can reintroduce the removed direction. Norm preservation can reduce scale drift, but preserves neither function nor capability.</p>

      <h2>Method matrix</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Name</th><th>Source answer-mean residualization</th><th>Destination answer-mean residualization</th><th>Restore norms</th></tr></thead>
        <tbody>
          <tr><td>Conventional</td><td>No</td><td>No</td><td>No</td></tr>
          <tr><td>Projected</td><td>Yes</td><td>Optional / implementation-dependent</td><td>No</td></tr>
          <tr><td>Biprojected</td><td>Yes</td><td>Yes</td><td>No</td></tr>
          <tr><td>Norm-preserving</td><td>No</td><td>No</td><td>Yes</td></tr>
          <tr><td>Norm-preserving biprojected</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
        </tbody>
      </table></div>

      <div class="callout"><strong>Interpretation</strong><p>Answer-mean residualization is a heuristic boundary condition, not proof of capability preservation. An absolute mean depends on the representation origin, and ordinary answered behavior occupies a distribution—not one arrow.</p></div>
      <p>A <a href="https://huggingface.co/blog/grimjim/norm-preserving-biprojected-abliteration" target="_blank" rel="noreferrer">norm-preserving biprojection case study</a> motivates the method. Its retention result remains a checkpoint-specific observation to replicate, not a cross-model law.</p>
      <div class="quiz"><strong>Checkpoint</strong><p>“Projected” is ambiguous unless you state where. Record whether answer-mean overlap was removed during measurement, during destination editing, or both.</p></div></template>
<template id="lesson-runtime-weight">
      <p class="eyebrow">09 · Core workflow</p>
      <h1>The same geometric idea can live in different places.</h1>
      <p class="lede">An intervention can modify a hidden state for one forward pass, be folded into every residual writer, touch only a selected writer set, or be learned as a small parameter update. These choices change reversibility, fidelity, cost, and side effects.</p>
      <div class="lesson-meta"><span>◷ 26 MIN</span><span>◇ PRACTICAL</span><span>⇄ RUNTIME / WEIGHTS</span></div>

      <h2>Why runtime and weight projection can be equivalent</h2>
      <div class="formula">writer output: y = Wx + b
runtime:       y′ = P⊥y
folded:        W′ = P⊥W,  b′ = P⊥b
therefore:     W′x + b′ = P⊥(Wx + b)
<small>This local equality holds when tensor orientation is correct and both weight and bias are projected.</small></div>
      <p>A transformer residual state is the sum of many sources, including the previous residual. To reproduce projection of the <em>whole</em> state, every relevant source must be projected or the hidden state must be projected again after addition. Editing only two prominent writer families is a targeted approximation, not exact algebraic equivalence.</p>

      <h2>Intervention classes</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Method</th><th>What changes</th><th>Advantages</th><th>Disadvantages</th></tr></thead>
        <tbody>
          <tr><td>Diagnostic knockout</td><td>Temporarily zero a layer, head, neuron, or feature.</td><td>Simple causal localization; original weights return immediately.</td><td>Large off-manifold perturbation; not a selective refusal method by itself.</td></tr>
          <tr><td>Runtime activation projection</td><td>Apply <code>P⊥</code> at chosen layers, tokens, or components.</td><td>Reversible, schedulable, observable, ideal for dose and causal tests.</td><td>Adds inference overhead and requires intervention-aware serving.</td></tr>
          <tr><td>All-writer orthogonalization</td><td>Fold <code>P⊥</code> into every residual source.</td><td>Closest permanent equivalent to global runtime projection.</td><td>Touches many tensors and can cause broad, repeated collateral change.</td></tr>
          <tr><td>Targeted writer surgery</td><td>Edit only selected attention/MLP outputs or causal sites.</td><td>Smaller footprint and potentially better utility retention.</td><td>Alternate paths can preserve or reconstruct the refusal feature.</td></tr>
          <tr><td>Learned low-rank update</td><td>Optimize a small map or adapter under behavior and protection losses.</td><td>Can model non-projector geometry and explicit tradeoffs.</td><td>Needs training, is easier to overfit, and weakens closed-form interpretability.</td></tr>
        </tbody>
      </table></div>

      <h2>Runtime schedules</h2>
      <div class="concept-grid">
        <div class="concept-card"><code>Every layer, every token</code><p>Strongest suppression and closest to a global constraint; highest overhead and broadest effect.</p></div>
        <div class="concept-card"><code>Selected layers</code><p>Targets a causal window and lowers cost; downstream layers may rebuild the feature.</p></div>
        <div class="concept-card"><code>Prompt boundary only</code><p>Cheap and useful when policy is decided before decoding; misses response-time dynamics.</p></div>
        <div class="concept-card"><code>Conditional / latched</code><p>Activates only when a calibrated gate fires; selectivity depends on a second classifier.</p></div>
      </div>

      <h2>Permanent-edit checklist</h2>
      <ul class="checklist">
        <li>Prove the runtime intervention before folding it into weights.</li>
        <li>Write down the residual-space axis of every target tensor; transpose mistakes can silently edit the input space.</li>
        <li>Decide explicitly whether biases, embeddings, experts, shared experts, and tied heads are in scope.</li>
        <li>Compare all-writer and targeted edits at matched total update norm.</li>
        <li>Reload in a fresh process and re-evaluate after every conversion or quantization step.</li>
      </ul>
      <div class="callout warning"><strong>Hooks are not checkpoint data</strong><p>A runtime hook disappears when the process ends. Saving model weights after a hook-based success does not preserve the intervention unless its map was explicitly folded into parameters.</p></div>
      <div class="quiz"><strong>Checkpoint</strong><p>Choose runtime projection for discovery and conditional control; choose weight folding only after the geometry, layer schedule, strength, and protected drift are validated.</p></div></template>
<template id="lesson-multidirectional-whitening">
      <p class="eyebrow">10 · Method atlas</p>
      <h1>One direction is a baseline, not a ceiling.</h1>
      <p class="lede">Refusal categories, styles, languages, and token positions can occupy several independent directions. Subspace methods model that rank explicitly—but every extra direction is another opportunity for collateral deletion.</p>
      <div class="lesson-meta"><span>◷ 28 MIN</span><span>◇ ADVANCED</span><span>▥ RANK-k</span></div>

      <h2>Paired SVD</h2>
      <p>When examples are meaningfully paired, form rows <code>Δᵢ = hᵢ(refused) − hᵢ(answered)</code> and take singular vectors. An <strong>uncentered</strong> SVD retains the shared mean shift and ranks total paired-delta energy. A <strong>centered</strong> SVD studies variation around that shift; augment it with the normalized mean delta if you also want the coherent shift. Neither is automatically correct, so report which matrix was decomposed.</p>
      <div class="formula">D = [Δ₁; Δ₂; …; Δₙ]          or Dᶜ = D − 1·mean(D)
D(*) = UΣVᵀ
B = first k rows of Vᵀ; if adding mean(D), joint-orthonormalize the set
h′ = h − αBᵀBh
<small>Choose k with held-out target effect and protected drift—not merely an explained-variance elbow.</small></div>

      <h2>Whitened subspaces</h2>
      <p>Ordinary SVD rewards directions with large raw variance. A covariance-whitened method measures change relative to variation on protected controls:</p>
      <div class="formula">uncentered: SΔᵘ = DᵀD / n
centered:   SΔᶜ = DᶜᵀDᶜ / n,  Dᶜ = D − 1·mean(D)
generalized eigenproblem: SΔv = λ(Cₚ + εI)v
<small>Choose uncentered to retain the coherent mean plus modes; choose centered to study modes around the mean. Ridge ε and sample size determine stability.</small></div>
      <p>Here <code>Cₚ</code> is protected-control covariance. Generalized eigenvectors are orthogonal in the <code>Cₚ + εI</code> metric, not necessarily in Euclidean residual space. If you solve the generalized problem directly, <code>v</code> is already in original coordinates; Euclidean-orthonormalize its span before using <code>BᵀB</code>. If you eigendecompose the whitened matrix, map a whitened vector <code>u</code> back with <code>(Cₚ+εI)⁻¹ᐟ²u</code>, then orthonormalize.</p>

      <h2>Affine and erasure families</h2>
      <div class="formula">ACE, with d̂ = normalize(μR − μA), P = d̂d̂ᵀ:
h′ = (I − P)h + PμA = h − P(h − μA)

LEACE, for centered covariance ΣXX and cross-covariance ΣXZ:
Q = (ΣXX¹ᐟ²)⁺,  C = QΣXZ
h′ = μX + [I − Q⁺ Pcol(C) Q](h − μX)
<small>ACE sets the edited coordinate to an answer-side value. LEACE removes linear cross-covariance with labels while minimizing distortion in the observed covariance geometry.</small></div>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Method</th><th>Core idea</th><th>Primary caution</th></tr></thead>
        <tbody>
          <tr><td>ACE</td><td>Project away the concept coordinate and re-center it at the typical answer-side value.</td><td>One centroid cannot represent a multimodal answer distribution.</td></tr>
          <tr><td>INLP</td><td>Repeatedly fit linear probes and project into their nullspaces.</td><td>Later layers or nonlinear probes may recover the concept.</td></tr>
          <tr><td>R-LACE</td><td>Learn a fixed-rank projection against the strongest linear adversary.</td><td>Minimax probe failure is not behavioral success.</td></tr>
          <tr><td>LEACE</td><td>Closed-form covariance-aware affine erasure with minimum linear distortion.</td><td>Needs representative covariance; zero cross-covariance is not nonlinear deletion.</td></tr>
          <tr><td>Protected spectral cleaning</td><td>Remove known capability/style basis components from the intervention direction before editing.</td><td>A protection registry can omit important features or remove the true mechanism.</td></tr>
        </tbody>
      </table></div>

      <h2>Rank-k and diverse-direction variants</h2>
      <p>Multidirectional methods use SVD, category prototypes, clustering, or optimized directions, then penalize redundancy and orthonormalize the retained span. A common practical baseline keeps the top four paired-difference axes, but rank should be selected rather than inherited. More rank can reduce refusal while simply erasing more model behavior, so plot target completion and protected utility against rank and total edit norm.</p>

      <h2>Prototype, cluster & manifold extensions</h2>
      <div class="formula">category prototype: r̂c = normalize(μR,c − μA,c)
cluster prototype:  r̂j = normalize(mean{Δᵢ : cluster(Δᵢ)=j})
joint linear basis: orthonormalize({r̂c or r̂j})
<small>Category prototypes use known groups; clustering discovers recurring modes. Both remain linear once their prototypes are combined.</small></div>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Extension</th><th>Advantage</th><th>Disadvantage</th><th>Foldability</th></tr></thead>
        <tbody>
          <tr><td>Category prototypes</td><td>Interpretable per-domain modes and easy stratified evaluation.</td><td>Requires trustworthy labels and can encode topic rather than outcome.</td><td>Easy after joint orthonormalization.</td></tr>
          <tr><td>Clustering paired deltas</td><td>Finds recurring modes without prespecified categories.</td><td>Cluster count and metric are unstable in high dimensions.</td><td>Easy if reduced to a small linear basis.</td></tr>
          <tr><td>Manifold / self-organizing map</td><td>Can represent curved or multimodal refusal geometry.</td><td>Experimental, data-hungry, difficult to falsify, and easy to overfit.</td><td>Hard; usually needs a conditional runtime map or local linear pieces.</td></tr>
        </tbody>
      </table></div>

      <div class="callout"><strong>Selection rule</strong><p>For row directions <code>G</code>, orthonormalize first or use the exact joint projector <code>Gᵀ(GGᵀ)⁺G</code>. Replacing the pseudoinverse with <code>(GGᵀ+λI)⁻¹</code> creates stable ridge shrinkage, but it is no longer an idempotent orthogonal projector.</p></div>
      <div class="quiz"><strong>Checkpoint</strong><p>“Whitened” should mean covariance was estimated and inverted or factorized. Unit-normalized vectors, RMSNorm outputs, clipped activations, and norm-restored weights are not whitened.</p></div></template>
<template id="lesson-conditional-distributional">
      <p class="eyebrow">11 · Method atlas</p>
      <h1>Cross the boundary without flattening the space.</h1>
      <p class="lede">Orthogonal projection moves every selected state to a zero coordinate. Newer methods ask a better question: where do genuine answer-side states live, and how little must change to reach them?</p>
      <div class="lesson-meta"><span>◷ 30 MIN</span><span>◇ ADVANCED</span><span>↝ CONTROLLED MAPS</span></div>

      <h2>Controlled latent-space evasion</h2>
      <p>Let higher values of a calibrated linear score <code>s(h)=wᵀh+b</code> denote the answer side. Controlled latent evasion changes only states that fail a chosen answer-side margin:</p>
      <div class="formula">δ* = [max(0, m − s(h)) / ‖w‖²]w
h′ = h + δ*
<small>If the score orientation is reversed, reverse the inequality and direction. The margin must be calibrated against realized semantic behavior and protected utility.</small></div>

      <h2>Gaussian optimal transport</h2>
      <p>Optimal-transport refusal ablation estimates the centroids and covariances of refusal-side and answer-side activations, then applies an affine map that matches the two Gaussian approximations in a low-rank PCA space.</p>
      <div class="formula">T(h) = μA + M(h − μR)
M = ΣR⁻¹ᐟ²(ΣR¹ᐟ²ΣAΣR¹ᐟ²)¹ᐟ²ΣR⁻¹ᐟ²
<small>Use positive-definite regularized covariances or low-rank pseudoinverses. Unlike a projector, this changes both center and covariance.</small></div>

      <h2>Learned low-rank interventions</h2>
      <div class="formula">h′ = h + U(Vᵀh),      U,V ∈ ℝᵈˣᵏ
min Ltarget + λ·KL(fedited ‖ fbase on controls) + η·E‖h′−h‖²
<small>A ReFT-style eraser learns a rank-k map while the base model stays frozen.</small></div>
      <p>These methods can capture non-projector geometry, but add training, overfitting risk, and a larger audit surface. After validating a runtime target map <code>T(h)</code>, protected ridge folding can fit <code>ΔW</code> by minimizing <code>Σtarget‖ΔWxᵢ−[T(Wxᵢ)−Wxᵢ]‖² + λ‖ΔW‖² + γΣcontrol‖ΔWxⱼ‖²</code>. The control term protects ordinary states; the result remains an approximation to the runtime map, distinct from simple orthogonalization.</p>

      <h2>Conditional control</h2>
      <div class="concept-grid">
        <div class="concept-card"><code>Prompt-latched gate</code><p>Decide once at the assistant boundary whether both the target domain and refusal trajectory are present; hold the strength fixed during generation.</p></div>
        <div class="concept-card"><code>Hysteretic gate</code><p>Use separate turn-on and turn-off thresholds so a long conversation does not flicker around a boundary.</p></div>
      </div>
      <div class="formula">g = 1[domain_score ≥ τD  and  refusal_score ≥ τR]
h′ = h − g·αBᵀBh
<small>A prompt-latched variant computes g at the assistant boundary and holds it fixed; a tokenwise gate can adapt but may flicker.</small></div>
      <p>CAST provides the conditional-steering lineage. Dual and hysteretic gates are natural adaptations, not established universal solutions. A topic gate can silently recreate over-refusal or miss euphemisms, so its calibration becomes part of the method's safety and selectivity claim.</p>

      <h2>Norm-aware continuous control</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Method</th><th>Action</th><th>Benefit</th><th>Risk</th></tr></thead>
        <tbody>
          <tr><td>Angular steering</td><td>Rotate within a learned 2D plane.</td><td>Preserves activation length and exposes a continuous angle.</td><td>The plane can still be confounded; a sign gate can be discontinuous.</td></tr>
          <tr><td>Natural-gradient actuation</td><td>Move along a protected covariance/Fisher metric.</td><td>Penalizes changes to sensitive control behavior.</td><td>Local linear and metric approximations can fail during generation.</td></tr>
          <tr><td>Partial projection</td><td>Use <code>0&lt;α&lt;1</code>.</td><td>Simple dose control.</td><td>Weaker refusal effect may still have diffuse side effects.</td></tr>
        </tbody>
      </table></div>

      <div class="formula">angular rotation for orthonormal plane vectors p,q:
a=pᵀh, b=qᵀh
a′=a cosθ−b sinθ,  b′=a sinθ+b cosθ
h′=h+(a′−a)p+(b′−b)q
<small>This is norm-preserving inside the chosen plane. It is adjacent to abliteration because it rotates rather than deletes a coordinate.</small></div>

      <div class="formula">natural-gradient / protected-metric step:
δ* = κ Cₚ⁻¹g / (gᵀCₚ⁻¹g)
<small>Among moves satisfying <code>gᵀδ=κ</code>, this minimizes <code>δᵀCₚδ</code>. Use a regularized protected metric; the guarantee is local and linear.</small></div>

      <div class="callout warning"><strong>Compile last</strong><p>Prove a runtime map first. Permanent weight folding, conversion, and quantization each introduce a new approximation and must be tested as new model conditions.</p></div></template>
<template id="lesson-sparse-circuits">
      <p class="eyebrow">12 · Method atlas</p>
      <h1>A probe can read a feature it does not control.</h1>
      <p class="lede">Prediction answers “where is information available?” Causal intervention answers “what must change to alter behavior?” Sparse and circuit methods are valuable only when they make that second question sharper.</p>
      <div class="lesson-meta"><span>◷ 28 MIN</span><span>◇ ADVANCED</span><span>⌘ CAUSAL LOCALIZATION</span></div>

      <h2>Matched activation patching</h2>
      <p>Run a refusing example and a carefully matched answering example. Replace one layer/token/component activation in the refusing run with its answer-side counterpart, measure the full-response change, then perform the reverse patch. This tests necessity and sufficiency more directly than a classifier.</p>
      <div class="formula">effect(l,t) = s_ref(model with hˡ,ᵗ_refuse ← hˡ,ᵗ_answer) − s_ref(baseline refuse)
<small>Use multiple matched pairs and corruption baselines. A patch can be off-manifold or carry unrelated pair differences.</small></div>

      <h2>Functional stages</h2>
      <div class="pipeline">
        <div class="pipeline-step"><b>DETECTOR</b><span>Encodes risky topic or policy evidence.</span></div>
        <div class="pipeline-step"><b>GATE</b><span>Routes the policy response.</span></div>
        <div class="pipeline-step"><b>WRITER</b><span>Introduces the refusal feature.</span></div>
        <div class="pipeline-step"><b>AMPLIFIER</b><span>Strengthens or repairs it later.</span></div>
        <div class="pipeline-step"><b>OPPOSER</b><span>Components may push back toward answering.</span></div>
      </div>
      <p>These labels are hypotheses to validate with interchange signatures. Editing the detector risks removing domain understanding; targeting a verified writer or gate can be more selective.</p>

      <h2>Sparse intervention families</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Granularity</th><th>Discovery</th><th>Intervention</th><th>Failure mode</th></tr></thead>
        <tbody>
          <tr><td>SAE feature bundle</td><td>Encode states into sparse learned latents and find refusal-linked features.</td><td>Clamp selected latents and preserve the SAE reconstruction residual.</td><td>Feature splitting, polysemanticity, dead latents, reconstruction error.</td></tr>
          <tr><td>Coordinate-sparse direction</td><td>Keep only large coordinates of a residual-space direction.</td><td>Project with the sparsified vector or basis.</td><td>Coordinate sparsity is basis-dependent and need not imply sparse parameters or circuits.</td></tr>
          <tr><td>Parameter / neuron sparsity</td><td>Gradients, masks, z-scores, or sparse optimization over components.</td><td>Mask, zero, rescale, or project selected rows, columns, or neurons.</td><td>A distributed feature can survive a small parameter mask; neuron identity changes under basis rotations.</td></tr>
          <tr><td>Attention head</td><td>Direct-logit attribution, patching, or head knockout.</td><td>Head output projection surgery or runtime masking.</td><td>A low-logit gate can still be causal through downstream amplification.</td></tr>
          <tr><td>Cross-layer path</td><td>Causal tracing, transcoders, and synergy search.</td><td>Interrupt a small bundle of sites.</td><td>Combinatorial overfit and downstream self-repair.</td></tr>
        </tbody>
      </table></div>

      <h2>The hydra effect</h2>
      <p>Removing one component can cause later components to reconstruct part of the computation. This explains why a one-layer intervention may look strong locally and weak at the final response, while a small multi-layer bundle succeeds. Search singles first, then promising pairs or 2–4 site bundles with an untouched validation set.</p>
      <div class="callout"><strong>Editability map</strong><p>Use gradients or probes as scalable candidate filters, then verify exact interventions. A high refusal probe score is evidence of decodability, not ownership.</p></div>
      <div class="quiz"><strong>Checkpoint</strong><p>If zeroing a head changes refusal but also destroys sentence structure, it is causal but not selective. Causality is necessary evidence, not the whole objective.</p></div></template>
<template id="lesson-moe-vlm">
      <p class="eyebrow">13 · Method atlas</p>
      <h1>Architecture changes where the policy can hide.</h1>
      <p class="lede">A dense Llama-like naming recipe is not a model-agnostic method. MoE routing, shared experts, multimodal fusion, and hybrid attention create additional causal sites and tensor layouts.</p>
      <div class="lesson-meta"><span>◷ 24 MIN</span><span>◇ ADVANCED</span><span>⌘ ROUTED MODELS</span></div>

      <h2>One MoE block</h2>
      <div class="formula">router probabilities pₑ(x) → select top-k experts
MLP output = Σₑ∈top-k pₑ(x) · Expertₑ(x)
residual next = residual + attention output + MLP output</div>
      <p>Refusal can be represented in shared attention, router logits, individual expert outputs, always-on shared experts, or their interaction. Routing frequency alone does not prove that an expert owns the safety mechanism; the router may remain topic-driven while expert parameters enforce policy.</p>

      <h2>Expert-aware options</h2>
      <div class="method-table-wrap"><table class="method-table">
        <thead><tr><th>Method</th><th>What it changes</th><th>Required control</th></tr></thead>
        <tbody>
          <tr><td>All-writer projection</td><td>Every selected expert down/output projection plus attention writers.</td><td>Compare to dense-equivalent edit norm and check shared experts.</td></tr>
          <tr><td>Expert-support localization</td><td>Experts whose output weights strongly support a refusal basis.</td><td>Causal expert masking; do not select from router frequency alone.</td></tr>
          <tr><td>Expert-specific steering</td><td>Add or remove a direction inside one or all routed experts.</td><td>Condition on natural routing and compare forced-expert artifacts.</td></tr>
          <tr><td>Category-prototype expert edit</td><td>Several category directions applied only to high-support experts.</td><td>Joint search over target effect, KL, and footprint.</td></tr>
          <tr><td>Router intervention</td><td>Redirect expert selection.</td><td>Separate topic-routing changes from refusal-control changes.</td></tr>
        </tbody>
      </table></div>

      <h2>Tensor geometry in expert models</h2>
      <p>A dense writer is usually a 2D map; fused expert banks often add an expert axis and become 3D. Projection must be applied along the residual-output axis for each selected expert, regardless of storage order. This is one reason architecture adaptation is part of the method: a parameter-name match does not prove that every router, shared expert, residual writer, or custom block was included.</p>

      <h2>Multimodal models</h2>
      <p>A VLM can represent visual hazard recognition, text-policy refusal, and fusion-stage control in different spaces. A text-only direction cannot establish a multimodal mechanism. A truly multimodal edit requires modality-specific samples, per-stream centering, fusion-layer localization, and text→image / image→text causal transfer tests.</p>
      <div class="concept-grid">
        <div class="concept-card"><code>Shared subspace</code><p>Find a refusal component with causal effects across text, vision, and fusion streams.</p></div>
        <div class="concept-card"><code>Modality-specific complement</code><p>Preserve visual recognition and ordinary OCR/code-image behavior that should not be erased by a text-derived vector.</p></div>
      </div>

      <div class="callout warning"><strong>Model-family audit</strong><p>Inspect the forward pass, state-dict keys, tied weights, normalization, quantization metadata, and tensor orientation. Print exactly which writers will be modified before saving anything.</p></div></template>
