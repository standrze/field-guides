<template id="lesson-quantization-and-performance"><p class="eyebrow">20 · Performance</p>
<h1>A bit width is not a complete quantization method.</h1>
<p class="lede">A useful MLX result must name the value format, grouping, scale rule, quantized layers, consumer kernel, quality change, and workload shape—not merely “4-bit.”</p>
<div class="lesson-meta"><span>◷ 22 MIN</span><span>◇ ADVANCED</span><span>RESEARCH PATH</span></div>
<div class="version-banner"><strong>Research boundary</strong><p>The course labs remain pinned to <code>mlx-swift 0.31.6</code> and <code>mlx-swift-lm 3.31.4</code>. The format audit below also inspected current MLX source at commit <code>99e45f71dcb4</code>. Confirm API availability before copying a current-main configuration into the pinned project.</p></div>
<h2>What MLX can represent</h2>
<p>At the audited core revision, MLX accepts these native quantization configurations:</p>
<table>
<thead>
<tr>
<th>Mode</th>
<th>Valid configuration</th>
<th>Stored representation</th>
</tr>
</thead>
<tbody>
<tr>
<td>Affine</td>
<td>groups 32, 64, or 128; 2, 3, 4, 5, 6, or 8 bits</td>
<td>packed integer codes plus a floating scale and bias per group</td>
</tr>
<tr>
<td>NVFP4</td>
<td>group 16; 4 bits</td>
<td>E2M1 values, E4M3 block scales, and an optional FP32 global scale</td>
</tr>
<tr>
<td>MXFP4</td>
<td>group 32; 4 bits</td>
<td>E2M1 values with E8M0 block scales</td>
</tr>
<tr>
<td>MXFP8</td>
<td>group 32; 8 bits</td>
<td>E4M3 values with E8M0 block scales</td>
</tr>
</tbody>
</table>
<p>A registry name can identify a prepared model:</p>
<pre><code class="language-swift">let configuration = LLMRegistry.gemma3_1B_qat_4bit
</code></pre>
<p>The name does not disclose the complete recipe. Record group size, value format, scale and bias representation, eligible and excluded layers, calibration data, quantization-aware training status, source revision, and converter revision. Compute artifact bytes from the serialized tensors; nominal payload bits omit scale, bias, alignment, codebook, and outlier metadata.</p>
<h2>Follow the packed representation to its consumer</h2>
<p>MLX quantized linear kernels can decode packed weights while multiplying, without materializing one complete floating weight matrix. Explicitly requesting a dequantized weight does materialize it. Row-contiguity repairs can also introduce a copy before dispatch.</p>
<p>This makes performance shape-specific:</p>
<table>
<thead>
<tr>
<th>Workload</th>
<th align="right">Representative matrix rows</th>
<th>What to measure</th>
</tr>
</thead>
<tbody>
<tr>
<td>Single-token decode</td>
<td align="right"><code>M = 1</code></td>
<td>quantized matrix-vector path and per-token tail latency</td>
</tr>
<tr>
<td>Speculative verification</td>
<td align="right"><code>M = 2…8</code></td>
<td>small-matrix dispatch and draft acceptance</td>
</tr>
<tr>
<td>Prompt prefill</td>
<td align="right"><code>M ≥ 128</code></td>
<td>matrix-matrix throughput and compilation state</td>
</tr>
</tbody>
</table>
<p>Do not assume fewer bits means faster execution. A format can reduce memory traffic yet lose time to unpacking, conversion, a less favorable kernel, compilation, or a hidden copy. Benchmark every real layer shape on every supported chip.</p>
<h2>What the papers contribute</h2>
<table>
<thead>
<tr>
<th>Paper</th>
<th>Established contribution</th>
<th>MLX interpretation</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="./papers/06-gptq.pdf">GPTQ</a> and <a href="./papers/08-awq.pdf">AWQ</a></td>
<td>calibrated weight-only PTQ baselines</td>
<td>compare quality; their CUDA timings are not Metal results</td>
</tr>
<tr>
<td><a href="./papers/07-smoothquant.pdf">SmoothQuant</a> and <a href="./papers/09-quarot.pdf">QuaRot</a></td>
<td>equivalent scaling or rotation can reduce outlier difficulty</td>
<td>absorb transforms where possible; charge any remaining runtime work</td>
</tr>
<tr>
<td><a href="./papers/10-higgs.pdf">HIGGS</a></td>
<td>a layer-error model and discrete non-uniform allocation</td>
<td>replace fixed mixed recipes only if the predictor works on held-out MLX models</td>
</tr>
<tr>
<td><a href="./papers/14-scalesearch.pdf">ScaleSearch</a></td>
<td>search nearby representable block scales</td>
<td>strongest converter-only candidate for MLX NVFP4</td>
</tr>
<tr>
<td><a href="./papers/13-rethinking-kv-compression.pdf">Rethinking KV Compression</a></td>
<td>systems counterevidence to memory-only cache claims</td>
<td>require end-to-end latency, output-length, and peak-memory gates</td>
</tr>
</tbody>
</table>
<p>These methods are not interchangeable. Importing a GPTQ or AWQ checkpoint and repacking it into an affine MLX tensor does not mean the native MLX quantizer performed that paper’s optimization.</p>
<h2>Immediate experiment: ScaleSearch for NVFP4</h2>
<p>Ordinary block floating-point conversion typically derives one block scale from its largest magnitude. ScaleSearch evaluates nearby <em>representable</em> scale values, quantizes and reconstructs the block under each candidate, and retains the scale with the lowest reconstruction error.</p>
<p>The peer-reviewed MLSys 2026 paper reports 27% lower NVFP4 quantization error and, in one Qwen3-8B comparison, up to 15 points on MATH500. Those are the authors’ NVIDIA-based results—not measurements on MLX or Apple silicon.</p>
<p>The compatibility is what makes the idea useful here: MLX already accepts NVFP4’s E2M1 values and E4M3 block scale. A converter can choose a better valid scale while preserving the stored format and current inference kernel. Conversion becomes more expensive; warm inference should remain on the same path, but that is a hypothesis to verify.</p>
<h2>Proposed research technique: ScalePlan-MLX</h2>
<p>ScalePlan-MLX combines compatible ideas without claiming that the combination is already novel or proven:</p>
<ol>
<li><p>Enumerate MLX-native candidates for each eligible linear layer: affine groups and bit widths, MXFP4, MXFP8, ordinary NVFP4, and ScaleSearch-NVFP4.</p>
</li>
<li><p>Measure exact layer shapes for decode, small speculative batches, and prefill on the target Apple GPU.</p>
</li>
<li><p>Record stored bytes, metadata, reconstruction error, teacher/student divergence, peak memory, hidden-copy bytes, and cold compilation.</p>
</li>
<li><p>Fit a HIGGS-style per-layer sensitivity model, then reject that proxy if it fails to predict held-out model loss.</p>
</li>
<li><p>Select one candidate per layer under explicit quality, size, and latency budgets using dynamic programming or constraint solving.</p>
</li>
<li><p>Produce separate static decode-first and prefill-first plans; do not keep duplicate weights for live switching unless measurements justify the memory.</p>
</li>
</ol>
<p>An optional Hadamard-preconditioned candidate belongs after the base experiment. MLX exposes a Hadamard transform, but an unabsorbed rotation still has runtime and fusion costs.</p>
<h2>Falsification gates</h2>
<p>Compare FP16/BF16, affine-4 group 64, ordinary MXFP4/NVFP4, existing fixed mixed recipes, ScaleSearch-NVFP4, planning without scale search, and full ScalePlan. Use multiple model families, at least two Apple GPU generations, three calibration seeds, and both short and long prompts.</p>
<p>Pre-register failure conditions:</p>
<ul>
<li><p>ScaleSearch must reduce median block or layer reconstruction error by at least 15% on two model families.</p>
</li>
<li><p>The same-format ScaleSearch model must keep warm latency within 2% of ordinary NVFP4; otherwise the runtime path was not equivalent.</p>
</li>
<li><p>At matched quality, ScalePlan must reduce model bytes or decode latency by at least 10% versus the best uniform or fixed recipe on two chips.</p>
</li>
<li><p>Peak memory, answer flips, long-context retrieval, output length, energy, and thermal behavior are release metrics—not footnotes.</p>
</li>
<li><p>A result confined to one model, prompt shape, or chip must be reported as configuration-specific.</p>
</li>
</ul>
<p>Warm and cold runs answer different questions. Force lazy work inside the measured interval, record compilation separately, and report variation rather than the single best run.</p>
<h2>Why KV cache is a second research track</h2>
<p>Current MLX Swift LM source already contains affine, TurboQuant, and variance-normalized cache strategies. A generic “add KIVI” proposal is therefore not a fresh starting point. <a href="./papers/11-commvq.pdf">CommVQ</a>, <a href="./papers/12-turboattention.pdf">TurboAttention</a>, and <a href="./papers/15-kitty.pdf">Kitty</a> suggest higher-upside designs, but each couples its representation to new attention or cache-layout work. Benchmark the existing paths consistently before designing those kernels.</p>
<p><strong>Ship gate:</strong> a quantization win exists only when the exact artifact preserves required quality and improves the measured user path within the real memory and thermal envelope.</p>
</template>
<template id="lesson-fine-tuning"><p class="eyebrow">21 · Training</p>
<h1>Adaptation is an experiment, not a feature toggle.</h1>
<p class="lede">MLX Swift LM supports parameter-efficient adapters and full fine-tuning. Begin by proving that data, evaluation, and a prompt-only baseline are sound.</p>
<div class="lesson-meta"><span>◷ 15 MIN</span><span>◇ ADVANCED</span><span>CONTROLLED TRAINING</span></div>
<p>Use the least invasive method that meets the goal:</p>
<table>
<thead>
<tr>
<th>Method</th>
<th>Trainable state</th>
<th>Best fit</th>
</tr>
</thead>
<tbody>
<tr>
<td>Prompt/template change</td>
<td>none</td>
<td>behavior expressible through context</td>
</tr>
<tr>
<td>LoRA</td>
<td>small low-rank matrices</td>
<td>efficient domain/style adaptation</td>
</tr>
<tr>
<td>DoRA</td>
<td>low-rank direction plus magnitude treatment</td>
<td>adapter experiment requiring that parameterization</td>
</tr>
<tr>
<td>Adapter over quantized base</td>
<td>small adapter; base stays low bit</td>
<td>tight memory budgets</td>
</tr>
<tr>
<td>Full fine-tuning</td>
<td>all selected model parameters</td>
<td>sufficient data, memory, and strong justification</td>
</tr>
</tbody>
</table>
<p>At the pinned <code>mlx-swift-lm 3.31.4</code> baseline, an adapter configuration can be explicit:</p>
<pre><code class="language-swift">let configuration = LoRAConfiguration(
    numLayers: 16,
    fineTuneType: .lora,
    loraParameters: .init(
        rank: 8,
        scale: 10.0,
        keys: ["self_attn.q_proj", "self_attn.v_proj"]
    )
)

let adapter = try LoRAContainer.from(
    model: model,
    configuration: configuration
)
</code></pre>
<p>Target keys are architecture-specific. Verify them against the actual tracked module names; a list copied from a different model can adapt nothing or the wrong layers.</p>
<p>The training record needs dataset versions, splits, prompt format, tokenizer, base model revision, adapter configuration, optimizer, seed, iteration count, checkpoint cadence, and evaluation results. Measure a frozen zero-shot or few-shot baseline on the exact held-out set before the first update.</p>
<p>MLX Swift LM includes adapter types for regular and quantized linear layers. It is reasonable to say “LoRA over a quantized base.” Do not label every such workflow “QLoRA”: the QLoRA paper specifies NF4, double quantization, and paged-optimizer ideas that an MLX run may not use.</p>
<p>Before fusion, keep base and adapter artifacts separate so each can be verified or rolled back. If you fuse an adapter for deployment, produce a new immutable artifact and evaluate it against the unfused composition:</p>
<pre><code class="language-swift">try adapter.fuse(with: model)
</code></pre>
<p>Fusing changes the artifact lifecycle. Preserve the base revision, adapter checksum, fusion tool version, output checksum, and parity test.</p>
<div class="callout warning"><strong>Data boundary</strong><p>Training text can contain private data, licenses, hidden instructions, duplicates, or evaluation leakage. Local execution does not cure a bad dataset. Inventory and review data before tuning.</p></div>
<p><strong>Decision gate:</strong> ship the adapter only if it improves the target held-out metric, preserves protected capabilities and safety tests, fits the runtime budget, and has a documented rollback path.</p>
</template>
<template id="lesson-model-porting-and-app-architecture"><p class="eyebrow">22 · Applications</p>
<h1>A model port is a compatibility implementation.</h1>
<p class="lede">Matching class names is not enough. A trustworthy port reproduces configuration defaults, tensor operations, saved keys, cache behavior, tokenization, and reference outputs.</p>
<div class="lesson-meta"><span>◷ 14 MIN</span><span>◇ ADVANCED</span><span>PORT + INTEGRATE</span></div>
<p>An MLX Swift LM text-model port typically needs:</p>
<ol>
<li><p>A <code>Codable</code> and <code>Sendable</code> configuration mirroring the artifact’s <code>config.json</code>.</p>
</li>
<li><p><code>Module</code> types for attention, MLP, blocks, embeddings, and output head.</p>
</li>
<li><p><code>@ModuleInfo(key:)</code> and <code>@ParameterInfo(key:)</code> values matching saved keys.</p>
</li>
<li><p>Conformance to the model and KV-cache protocols required by the package.</p>
</li>
<li><p>A <code>sanitize(weights:)</code> step for documented prefix, generated-value, or tied-weight differences.</p>
</li>
<li><p>Registration of <code>model_type</code> in the type registry.</p>
</li>
<li><p>Numerical fixtures against a trusted implementation.</p>
</li>
</ol>
<p>The pattern for one saved projection is explicit:</p>
<pre><code class="language-swift">final class AttentionBlock: Module {
    @ModuleInfo(key: "q_proj") var query: Linear
    @ModuleInfo(key: "k_proj") var key: Linear
    @ModuleInfo(key: "v_proj") var value: Linear
    @ModuleInfo(key: "o_proj") var output: Linear

    // Initialization and forward pass must follow the source architecture.
}
</code></pre>
<p>If embeddings are tied, reuse the correct weight at the output. If rotary-frequency arrays should be generated rather than loaded, remove only those documented keys. Never silence all unexpected-key errors to get a green load.</p>
<p>Once the model works, place it behind a narrow application service:</p>
<pre><code class="language-swift">protocol LocalTextGenerating: Sendable {
    func respond(to prompt: String) async throws -&gt; String
    func reset() async
}
</code></pre>
<p>The concrete service owns model loading, one or more session objects, cancellation, limits, and telemetry. The view model owns presentation state and a task handle. Views never mutate a raw <code>Module</code> or choose an artifact path.</p>
<p><code>MLXArray</code> is not <code>Sendable</code>. Keep lazy arrays, model parameters, optimizers, and session state inside one actor or the synchronization boundary supplied by <code>ModelContainer</code>; return strings, scalar statistics, or deliberately materialized value data across task boundaries. Unified memory does not make unsynchronized Swift access safe.</p>
<pre><code class="language-text">View -&gt; ViewModel -&gt; LocalModelService -&gt; ModelContainer
                    |                 -&gt; ChatSession per conversation
                    -&gt; ArtifactStore  -&gt; approved local model directories
</code></pre>
<p>This boundary lets tests substitute a deterministic generator and lets the app change model, quantization, or loader without rewriting UI.</p>
<p><strong>Port acceptance:</strong> exact configuration decoding, zero unexplained keys, shape audit, fixed-logit comparison, deterministic short generation, cache parity across multiple tokens, tokenizer/template tests, and memory/performance measurements on supported hardware.</p>
</template>
<template id="lesson-validation-privacy-security"><p class="eyebrow">23 · Production</p>
<h1>On-device does not mean risk-free.</h1>
<p class="lede">Local execution can reduce data exposure, but the application still processes untrusted prompts, documents, model artifacts, generated content, and optional tool calls.</p>
<div class="lesson-meta"><span>◷ 15 MIN</span><span>◇ PRODUCTION</span><span>TRUST BOUNDARIES</span></div>
<p>Build an assurance matrix rather than one golden prompt:</p>
<table>
<thead>
<tr>
<th>Layer</th>
<th>Evidence</th>
</tr>
</thead>
<tbody>
<tr>
<td>Arrays</td>
<td>shapes, dtypes, known-value operations, tolerance tests</td>
</tr>
<tr>
<td>Model</td>
<td>weight-key audit, reference logits, cache parity</td>
</tr>
<tr>
<td>Tokenizer</td>
<td>round trips, special tokens, chat templates, Unicode</td>
</tr>
<tr>
<td>Generation</td>
<td>deterministic fixtures, stop behavior, cancellation, limits</td>
</tr>
<tr>
<td>Product</td>
<td>task metrics, error review, accessibility, lifecycle tests</td>
</tr>
<tr>
<td>Operations</td>
<td>checksums, storage protection, memory, energy, rollback</td>
</tr>
</tbody>
</table>
<p>Treat artifact installation as a security boundary. Accept only expected files, cap sizes, verify an app-owned manifest and digests, resolve paths inside an approved directory, and never execute bundled code. Record the source revision and license. A model update is a software release input even when no Swift line changes.</p>
<p>Protect user data by design:</p>
<ul>
<li><p>state clearly what remains on device and what any integration may download or upload;</p>
</li>
<li><p>store conversation history only when the feature requires it;</p>
</li>
<li><p>apply file protection appropriate to sensitivity;</p>
</li>
<li><p>exclude sensitive model/session data from logs and crash annotations;</p>
</li>
<li><p>clear sessions and media references at the promised lifecycle point;</p>
</li>
<li><p>let users remove downloaded models and histories;</p>
</li>
<li><p>do not send prompts to analytics.</p>
</li>
</ul>
<p>Prompt injection remains relevant when local models read external documents or can invoke tools. Retrieved text is untrusted content, not policy. Filter retrieval by the user’s permissions before prompting, constrain tool schemas, validate all arguments, and require confirmation for consequential effects.</p>
<p>Generated output is untrusted too. Escape it before rendering rich content, never interpret it as code, and label uncertainty where the product could encourage overreliance.</p>
<p>Operational telemetry should use bounded aggregates such as load duration, time to first token, token counts, cancellation reason, peak memory class, and typed error codes. It should not contain raw prompts or generations by default.</p>
<div class="callout warning"><strong>Memory pressure is a correctness event</strong><p>An app terminated under pressure did not merely miss a performance target. Test admission, cancellation, session clearing, background transitions, and recovery without corrupting model state.</p></div>
<p><strong>Release statement:</strong> name the model revision, package versions, supported devices, maximum context/output, known quality limits, data-retention behavior, network behavior, and rollback artifact.</p>
</template>
<template id="lesson-capstone"><p class="eyebrow">24 · Practice</p>
<h1>Build the smallest assistant you can defend.</h1>
<p class="lede">The capstone is a local, single-user Swift application that answers questions about a user-selected text file without general filesystem or network access.</p>
<div class="lesson-meta"><span>◷ 18 MIN</span><span>◇ PROJECT</span><span>END TO END</span></div>
<h3>Product contract</h3>
<p>The user explicitly selects one UTF-8 text file. The app chunks it locally, uses either bounded prompt context or a local embedder index, and answers with a short response. It has no tools, no background server, no arbitrary paths, and no prompt telemetry.</p>
<h3>Pinned baseline</h3>
<pre><code class="language-text">mlx-swift       0.31.6
mlx-swift-lm    3.31.4
model           exact local revision and checksum
platform        declared Apple silicon device and OS floor
</code></pre>
<h3>Architecture</h3>
<pre><code class="language-text">FileImporter
   -&gt; TextValidator (encoding, size, permissions)
   -&gt; ChunkStore (memory-bounded, local)
   -&gt; Retrieval or ContextBuilder
   -&gt; LocalModelService
        -&gt; verified ModelContainer
        -&gt; one ChatSession
   -&gt; ViewModel (stream, cancel, reset)
   -&gt; SwiftUI view
</code></pre>
<h3>Required implementation steps</h3>
<ol>
<li><p>Prove a one-array MLX smoke test and exact Xcode build route.</p>
</li>
<li><p>Install and verify the local model artifact before loading.</p>
</li>
<li><p>Load through the 3.x downloader/tokenizer boundary using a local path.</p>
</li>
<li><p>Enforce document, prompt, output, context, and concurrency limits.</p>
</li>
<li><p>Stream generation from a view-model-owned task.</p>
</li>
<li><p>Make cancel and reset visible; reset clears the session and selected document state.</p>
</li>
<li><p>Record only privacy-preserving performance metrics.</p>
</li>
<li><p>Add deterministic fixtures and a small human-reviewed question set.</p>
</li>
</ol>
<h3>Acceptance tests</h3>
<table>
<thead>
<tr>
<th>Test</th>
<th>Pass condition</th>
</tr>
</thead>
<tbody>
<tr>
<td>Clean offline launch</td>
<td>installed model loads without network access</td>
</tr>
<tr>
<td>Unsupported artifact</td>

</tr>
<tr>
<td>Oversized file</td>

</tr>
<tr>

</tr>

<h3>Benchmark record</h3>
<p>Measure cold load, time to first token, steady generation, peak memory, cancellation latency, and energy/thermal behavior. Run with the largest supported file and context on the least-capable supported machine. Compare a quantized and non-quantized candidate only if both fit.</p>
