<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build interactive terminal interfaces in Swift with SwiftTUI.">
  <meta name="theme-color" content="#79e0bd">
  <title>SwiftTUI Field Guide</title>
  <link rel="stylesheet" href="./styles.css?v=10">
  <link rel="stylesheet" href="./learning.css?v=1">
  <script src="./pronunciation.js?v=1" defer></script>
  <script src="./learning.js?v=3" defer></script>
  <script src="./audiobook-source.js?v=2" defer></script>
</head>
<body data-guide-id="swift">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#welcome" aria-label="SwiftTUI Field Guide home">
        <span class="brand-mark">S/</span>
        <span><strong>SwiftTUI</strong><small>TERMINAL FIELD GUIDE</small></span>
      </a>
      <div class="progress-card">
        <div class="progress-copy"><span>Your progress</span><strong id="progress-label">0%</strong></div>
        <div class="progress-track"><i id="progress-bar"></i></div>
      </div>
      <nav id="course-nav" aria-label="Course chapters"></nav>
      <div class="sidebar-foot"><span class="status-dot"></span> SWIFT · SHELL · TUI</div>
    </aside>

    <main>
      <header class="topbar">
        <button class="menu-button" id="menu-button" aria-label="Open course navigation">☰</button>
        <div class="crumb" id="crumb">00 / Orientation</div>
        <button class="key-hint" id="search-button"><kbd>/</kbd> Jump to Lesson</button>
      </header>
      <div class="lesson-stage">
        <a class="lesson-home-grid" href="../" aria-label="Go to the learning library homepage" title="Learning library home"></a>
        <article id="lesson" tabindex="-1"></article>
      </div>
      <footer class="lesson-footer">
        <button id="previous" class="nav-button">← Previous</button>
        <button id="complete" class="complete-button">Mark complete</button>
        <button id="next" class="nav-button">Next →</button>
      </footer>
    </main>
  </div>

  <dialog id="search-dialog">
    <div class="search-box">
      <label for="search-input">Jump to Lesson</label>
      <input id="search-input" type="search" placeholder="Try “focus” or “overlays”…" autocomplete="off">
      <div id="search-results"></div>
      <small><kbd>↑</kbd> <kbd>↓</kbd> navigate · <kbd>enter</kbd> open · <kbd>esc</kbd> close</small>
    </div>
  </dialog>

  <script src="./course.js?v=4"></script>
  <script src="./labs.js?v=3"></script>
  <script src="./appearance.js?v=7"></script>
  <script src="./app.js?v=8"></script>
</body>
</html>
